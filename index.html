<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>September Again — démarchage</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
:root{--paper:#DDD3BE;--card:#E9E1D0;--ink:#2B1A16;--ink-soft:#5C4A40;--fade:#8A7C68;
 --rule:#BCAF97;--oxblood:#7C2733;--amber:#B36B12;--moss:#4C5F3C;--dead:#9A9086;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#191512;--card:#241D19;--ink:#E6DCC8;
 --ink-soft:#B8AB96;--fade:#8A7C68;--rule:#3A302A;--oxblood:#D0616E;--amber:#E0A03F;--moss:#93AC7C;--dead:#6B6157;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#191512;--card:#241D19;--ink:#E6DCC8;--ink-soft:#B8AB96;--fade:#8A7C68;
 --rule:#3A302A;--oxblood:#D0616E;--amber:#E0A03F;--moss:#93AC7C;--dead:#6B6157;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.c,h1,h2,h3{font-family:"Saira Condensed","Arial Narrow","Helvetica Neue Condensed",Helvetica,Arial,sans-serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 70px}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 12px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.mark{font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;line-height:1}
.top .sp{flex:1}
.top select{background:transparent;border:1px solid var(--rule);border-radius:3px;padding:4px 7px;font-size:13px}
.lnk{font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--rule);padding-bottom:1px}
.lnk:hover{color:var(--oxblood);border-color:var(--oxblood)}
/* timeline */
.tl{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:18px 0 2px;align-items:end}
.tlc{display:flex;flex-direction:column;justify-content:flex-end;min-height:112px;padding:0;border-radius:3px 3px 0 0}
.tlc:hover{background:var(--card)}
.tlc[aria-pressed="true"]{background:var(--card);box-shadow:inset 0 0 0 1px var(--oxblood)}
.tlb{display:flex;flex-direction:column;gap:2px;justify-content:flex-end;padding:0 2px}
.tlb i{height:9px;border-radius:1px;background:var(--rule)}
.tlb i.w{background:var(--amber)} .tlb i.ok{background:var(--moss)} .tlb i.dead{background:var(--dead)}
.tln{font-size:12px;text-align:center;color:var(--fade);font-variant-numeric:tabular-nums;padding-top:3px;
 font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif}
.tll{font-size:12px;text-align:center;color:var(--fade);border-top:1px solid var(--rule);padding:3px 0 5px;
 font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif;text-transform:uppercase}
.tlc.now .tll{color:var(--ink);border-top:2px solid var(--ink)}
.tlc.w .tll{color:var(--amber);border-top-color:var(--amber)}
.tlc.none .tll{color:var(--oxblood);border-top-style:dashed}
.snote{font-size:13px;color:var(--ink-soft);margin:0}
.filtered{display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--amber);margin-top:9px}
/* encart prioritaire */
.prio{background:var(--card);border:1px solid var(--oxblood);border-radius:5px;padding:15px 16px;margin-top:20px}
.prio .ph{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.prio h2{font-size:19px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.prio .n{font-size:15px;color:var(--fade);font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif}
.prio .sp{flex:1}
.sortb{font-size:12.5px;color:var(--ink-soft);border:1px solid var(--rule);border-radius:3px;padding:3px 8px}
.sortb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pline{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dotted var(--rule);flex-wrap:wrap}
.pline:last-child{border-bottom:none}
.pline .pn{font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif;font-size:18px;font-weight:600}
.pline .pw{font-size:13px;color:var(--ink-soft);flex:1;min-width:120px}
.pline .pw b{color:var(--amber)}
.prio .empty{font-size:13.5px;color:var(--ink-soft);margin:6px 0 0}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.q{flex:1;min-width:160px;border:1px solid var(--rule);border-radius:3px;padding:7px 10px;font-size:14px;background:var(--card)}
/* groupes */
.grp{margin-top:26px}
.ghead{display:flex;align-items:baseline;gap:9px;width:100%;padding-bottom:7px;border-bottom:2px solid var(--ink)}
.ghead h2{font-size:20px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.ghead .n{font-size:16px;color:var(--fade);font-variant-numeric:tabular-nums;font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif}
.ghead .gs{flex:1;font-size:13px;color:var(--ink-soft);text-align:right;font-weight:400;font-family:"IBM Plex Sans",sans-serif}
.gsub{font-size:13px;color:var(--ink-soft);margin:7px 0 0}
.rows{margin-top:2px}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) auto;gap:10px;align-items:baseline;
 width:100%;padding:10px 8px 10px 11px;border-bottom:1px solid var(--rule);position:relative}
@media(max-width:660px){.row{grid-template-columns:1fr;gap:2px}}
.row:hover{background:var(--card)}
.row[aria-expanded="true"]{background:var(--card)}
.row[aria-expanded="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--oxblood)}
.rn{font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif;font-size:19px;font-weight:600;line-height:1.15}
.rp{font-size:12.5px;color:var(--fade);display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:400;margin-top:1px}
.rp .auto{color:var(--amber);font-style:italic}
.rw{font-size:13.5px;color:var(--ink-soft)}
.rw b{color:var(--amber);font-weight:600}
.rl{font-size:12.5px;color:var(--fade);white-space:nowrap;text-align:right}
.rc{font-size:12.5px;margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-family:"IBM Plex Sans",sans-serif;font-weight:400}
.rc .ct{color:var(--ink-soft);word-break:break-all;margin-right:2px}
.rc .no{color:var(--amber);font-weight:600}
.cp{font-size:11.5px;color:var(--fade);border:1px solid var(--rule);border-radius:3px;padding:1px 6px}
.cp:hover{color:var(--ink);border-color:var(--ink)}
.pin{font-size:15px;color:var(--rule);padding:0 5px;line-height:1}
.pin:hover{color:var(--amber)}
.pin.on{color:var(--amber)}
@media(max-width:660px){.rl{text-align:left}}
/* panneau déplié */
.panel{background:var(--card);border-bottom:1px solid var(--rule);padding:16px 14px 18px 14px}
.pnote{font-size:14px;color:var(--ink-soft);padding-left:11px;border-left:2px solid var(--rule);margin:0 0 14px;line-height:1.5}
.log{list-style:none;margin:0 0 14px;padding:0}
.log li{display:flex;gap:11px;padding:7px 0;border-bottom:1px dotted var(--rule);font-size:13.5px}
.log .w{flex:0 0 80px;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:500}
.log .w em{display:block;font-style:normal;font-size:10.5px;color:var(--oxblood)}
.log .t{flex:1;min-width:0}.log .who{font-weight:600}
.del{color:var(--fade);font-size:17px;line-height:1;padding:0 4px}.del:hover{color:var(--oxblood)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.b{border-radius:4px;padding:9px 15px;font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif;
 font-size:17px;font-weight:600;background:var(--ink);color:var(--paper)}
.b:hover{background:var(--oxblood)}
.b.o{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.b.o:hover{border-color:var(--ink)}
.b.s{font-size:14px;padding:6px 11px}
.b[disabled]{opacity:.45;cursor:default}
.draft{margin-top:14px}
.draft textarea{width:100%;min-height:240px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;
 padding:12px;font-size:14.5px;line-height:1.55;resize:vertical}
.msg{font-size:13px;color:var(--ink-soft);margin-top:8px}.msg.err{color:var(--oxblood)}
a.go{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--rule)}
a.go:hover{color:var(--oxblood);border-bottom-color:var(--oxblood)}
a.cp.go{display:inline-block;text-decoration:none;border:1px solid var(--rule);border-bottom-color:var(--rule);color:var(--fade)}
a.cp.go:hover{color:var(--ink);border-color:var(--ink)}
#gate{display:flex;justify-content:center;padding:40px 0}
.gbox{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:22px 24px;max-width:420px;width:100%}
.gbox h2{margin:0 0 10px}
.gbox p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin:0}
.b.danger{background:var(--oxblood)}
.b.o.danger{background:transparent;color:var(--oxblood);border-color:var(--oxblood)}
.b.o.danger:hover{background:var(--oxblood);color:var(--paper)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 13px;margin-top:14px;
 padding-top:14px;border-top:1px solid var(--rule)}
.f label{display:block;font-size:11.5px;color:var(--fade);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:7px 9px;font-size:14px}
.addrow{display:grid;grid-template-columns:130px 130px 1fr;gap:8px;margin:12px 0}
@media(max-width:520px){.addrow{grid-template-columns:1fr 1fr}.addrow .n2{grid-column:1/-1}}
.addrow input,.addrow select{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:7px 9px;font-size:13.5px;width:100%}
.hint{font-size:12.5px;color:var(--fade);margin-top:7px}
/* personnes */
.ppl{margin-top:15px;padding-top:14px;border-top:1px solid var(--rule)}
.ppl h4{font-size:13px;margin:0 0 9px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;
 font-family:"IBM Plex Sans",sans-serif}
.pc{display:flex;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px dotted var(--rule);flex-wrap:wrap}
.pc:last-of-type{border-bottom:none}
.pc .nm{font-weight:600;font-size:14.5px}
.pc .ro{font-size:12.5px;color:var(--fade)}
.pc .co{font-size:12.5px;color:var(--ink-soft);word-break:break-all}
.pc .via{font-size:12px;color:var(--moss);font-weight:600}
.pc .sp{flex:1}
.pc .also{font-size:12px;color:var(--oxblood)}
.pform{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px;margin-top:10px}
.pform .fields{border:none;padding-top:0;margin-top:0}
.mini{font-size:12px;color:var(--fade);border:1px solid var(--rule);border-radius:3px;padding:2px 7px}
.mini:hover{color:var(--ink);border-color:var(--ink)}
.rc .pv{color:var(--moss);font-weight:600}
.warn{background:var(--paper);border:1px solid var(--amber);border-radius:4px;padding:10px 12px;font-size:13.5px;margin-bottom:13px;color:var(--ink-soft)}
.warn b{color:var(--amber)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
.mbox{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:22px;max-width:560px;width:100%}
.mbox h2{font-size:25px;margin:0 0 8px}
.mbox textarea{width:100%;min-height:110px;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:11px;font-size:15px;resize:vertical}
.mbox p{font-size:14px;color:var(--ink-soft);margin:0 0 13px;line-height:1.5}
.boot{padding:50px 0;text-align:center;color:var(--ink-soft);font-size:14.5px}
.foot{border-top:1px solid var(--rule);margin-top:32px;padding-top:13px;font-size:12.5px;color:var(--fade);display:flex;gap:15px;flex-wrap:wrap}

/* charpente à trois colonnes */
.shell{display:grid;grid-template-columns:174px minmax(0,1fr) 250px;gap:26px;align-items:start;margin-top:18px}
@media(max-width:1140px){.shell{grid-template-columns:1fr;gap:20px}}
.nav,.side{position:sticky;top:12px}
@media(max-width:1140px){.nav,.side{position:static}}
.nav h4,.side h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--fade);
 margin:0 0 9px;font-weight:600;font-family:"IBM Plex Sans",sans-serif}
.nv{display:flex;flex-direction:column;gap:1px}
@media(max-width:1140px){.nv{flex-direction:row;flex-wrap:wrap;gap:6px}}
.nv button{display:flex;align-items:baseline;gap:7px;width:100%;padding:7px 10px;border-radius:3px;
 font-size:13.5px;color:var(--ink-soft);border-left:2px solid transparent}
.nv button:hover{background:var(--card);color:var(--ink)}
.nv button .n{margin-left:auto;font-size:12.5px;color:var(--fade);font-variant-numeric:tabular-nums}
.nv button.hot{border-left-color:var(--oxblood);color:var(--ink);font-weight:600}
.nv button.amb{border-left-color:var(--amber)}
@media(max-width:1140px){.nv button{width:auto;border:1px solid var(--rule)}}
.side{border-left:1px solid var(--rule);padding-left:18px}
@media(max-width:1140px){.side{border-left:none;padding-left:0;border-top:1px solid var(--rule);padding-top:16px}}
.gig{padding:9px 0;border-bottom:1px dotted var(--rule)}
.gig:last-of-type{border-bottom:none}
.gig .gn{font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif;font-size:17px;font-weight:600;display:block;line-height:1.15}
.gig .gd{font-size:12.5px;color:var(--moss);font-weight:600}
.gig .gp{font-size:12.5px;color:var(--fade)}
.side .none{font-size:13px;color:var(--ink-soft);line-height:1.55}
.prio.miss{border-color:var(--amber)}
.pline .due{color:var(--oxblood);font-weight:600}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;padding:2px 0}
.chk input{width:17px;height:17px;accent-color:var(--oxblood);cursor:pointer}
.chk label{cursor:pointer}
.star{color:var(--amber);font-size:13px}
.zones{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.zl{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--fade);font-weight:600;margin-right:3px}
.zb{border:1px solid var(--rule);border-radius:3px;padding:4px 9px;font-size:13px;color:var(--ink-soft);
 display:inline-flex;gap:6px;align-items:baseline}
.zb:hover{border-color:var(--ink);color:var(--ink)}
.zb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.zb .n{font-size:11.5px;opacity:.65;font-variant-numeric:tabular-nums}
.zb.clear{border-style:dashed;color:var(--amber);border-color:var(--amber)}
.zt{color:var(--ink-soft);font-weight:600}
.share{display:flex;gap:11px;align-items:center;flex-wrap:wrap;background:var(--card);
 border:1px solid var(--oxblood);border-radius:5px;padding:11px 14px;margin-bottom:4px;font-size:13.5px}
.share span{flex:1;min-width:150px;color:var(--ink-soft)}
.strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.strip .cp{font-size:12.5px;padding:3px 9px}
.mrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--rule);flex-wrap:wrap}
.mn{flex:1;min-width:150px;font-weight:600;font-size:14.5px}
.mn em{display:block;font-style:normal;font-size:12px;color:var(--fade);font-weight:400}
.mgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;flex:2;min-width:260px}
.mgrid .mo{border:1px solid var(--rule);border-radius:3px;padding:6px 0;text-align:center;font-size:12px;
 font-family:"Saira Condensed","Arial Narrow",Helvetica,Arial,sans-serif;font-weight:600;color:var(--ink-soft)}
.mgrid .mo:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
</style>
</head>

<div class="wrap">
  <div class="top">
    <span class="mark">September&nbsp;Again</span>
    <span class="sp"></span>
    <select id="me" title="Qui es-tu ?"></select>
    <button class="lnk" id="addbtn">+ Ajouter un lieu</button>
  </div>
  <div id="boot" class="boot">Chargement…</div>
  <div id="gate" hidden></div>
  <div class="shell" id="shell" hidden>
    <aside class="nav"><h4>Aller à</h4><div class="nv" id="nav"></div></aside>
    <main id="app"></main>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div id="modal"></div>
<script>

/* Ouvrir un lien : on passe par un vrai <a> plutôt que window.open, seul moyen
   fiable quand la page tourne dans un cadre (Claude) comme hors cadre. */
function normUrl(u){
  const t=String(u||"").trim();
  if(!t) return "";
  if(/^(https?:|mailto:|tel:)/i.test(t)) return t;
  if(/^[\w.+-]+@[\w-]+\.[\w.]{2,}$/.test(t)) return "mailto:"+t;
  return "https://"+t.replace(/^\/+/,"");
}
function openUrl(u){
  const h=normUrl(u); if(!h) return false;
  try{
    const a=document.createElement("a");
    a.href=h; a.target="_blank"; a.rel="noopener noreferrer";
    a.style.display="none"; document.body.appendChild(a);
    a.click(); setTimeout(()=>a.remove(),0);
    return true;
  }catch(e){ try{ window.open(h,"_blank","noopener"); return true; }catch(e2){ return false; } }
}
function hostOf(u){
  try{ return new URL(normUrl(u)).hostname.replace(/^www\./,""); }catch(e){ return String(u||"").slice(0,40); }
}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY=new Date(), iso=d=>d.toISOString().slice(0,10), todayISO=iso(TODAY);
const days=d=>d?Math.floor((TODAY-new Date(d+"T12:00:00"))/86400000):null;
const fmt=d=>{if(!d)return"";const p=d.split("-");return (+p[2])+" "+MSHORT[+p[1]-1]+" "+p[0].slice(2);};
const fmtL=d=>{if(!d)return"";const p=d.split("-");return (+p[2])+" "+MONTHS[+p[1]-1]+" "+p[0];};
const plus=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return iso(d);};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function mUntil(m){if(!m)return null;let x=m-(TODAY.getMonth()+1);return x<0?x+12:x;}
function logsOf(id){return exchanges.filter(e=>e.venueId===id).sort((a,b)=>a.date<b.date?1:-1);}
function last(id){const l=logsOf(id);return l.length?l[0]:null;}
function inWin(v){const m=mUntil(v.month);return m!==null&&m>=LEAD_MIN&&m<=LEAD_MAX;}
function reachable(v){return !!contactOf(v);}
function snoozed(v){return v.snooze&&v.snooze>todayISO;}
function dueByHand(v){ return !!(v.relanceFrom&&v.relanceFrom<=todayISO); }
function waiting(v){ return !!(v.relanceFrom&&v.relanceFrom>todayISO); }

/* le statut ne se saisit plus : il se déduit de l'historique */
function state(v){
  if(v.status==="valide") return {k:"valide",l:"Date obtenue"};
  if(v.status==="mort")   return {k:"mort",l:"Laissé tomber"};
  const l=last(v.id);
  if(!l) return {k:"jamais",l:"Jamais contacté"};
  const d=days(l.date);
  if(d<=STALE) return {k:"attente",l:"Écrit il y a "+d+" j"};
  return {k:"silence",l:"Sans réponse depuis "+d+" j"};
}
function actionable(v){
  if(v.status==="valide"||v.status==="mort") return false;
  if(dueByHand(v)) return true;    // une date posée à la main prime sur ma règle
  if(waiting(v)) return false;     // date future fixée : je me tais jusque-là
  if(inWin(v)) return true;
  const l=last(v.id);
  return !l || days(l.date)>STALE;
}
function group(v){
  if(v.status==="valide"||v.status==="mort") return "regle";
  if(waiting(v)&&!snoozed(v)) return "attente";
  if(snoozed(v)) return "plustard";
  if(!actionable(v)) return "attente";
  return reachable(v) ? "maintenant" : "sansadresse";
}
function why(v){
  if(dueByHand(v)) return "<b>Relance fixée au "+fmt(v.relanceFrom)+"</b> — c\u2019est passé.";
  if(waiting(v)) return "Relance programmée au "+fmt(v.relanceFrom)+".";
  if(inWin(v)) return "<b>Édition en "+MONTHS[v.month-1]+"</b> — écrire dans les prochaines semaines.";
  const l=last(v.id);
  if(!l) return "Jamais contacté.";
  return "Silence depuis "+days(l.date)+" jours.";
}
function rank(v){
  if(dueByHand(v)) return [0,-days(v.relanceFrom)];
  if(inWin(v)) return [0, mUntil(v.month)];
  const l=last(v.id);
  if(!l) return [1, 0];
  return [2, -days(l.date)];
}

function peopleOf(id){
  return [...people.values()].filter(p=>(p.venueIds||[]).indexOf(id)>=0)
    .sort((a,b)=>a.name.localeCompare(b.name,"fr"));
}
function pReach(p){ return !!((p.email&&p.email.trim())||(p.phone&&p.phone.trim())); }
function pContact(p){ const m=(p.email||"").trim(),t=(p.phone||"").trim(); return m||t; }

function contactOf(v){
  const m=(v.email||"").trim(), t=(v.phone||"").trim();
  if(m) return {k:"mail",v:m};
  if(t) return {k:"tel",v:t};
  const p=peopleOf(v.id).find(pReach);         // souvent la vraie porte d'entrée
  if(p) return {k:"personne",v:pContact(p),who:p.name,via:p.via||""};
  return null;
}

/* encart prioritaire : épinglés à la main + échéances proches joignables */
function prioList(){
  const all=[...venues.values()].filter(v=>v.status!=="mort"&&v.status!=="valide"&&!snoozed(v));
  const set=new Map();
  all.filter(v=>v.pin).forEach(v=>set.set(v.id,v));            // priorité décidée par vous
  all.filter(dueByHand).forEach(v=>set.set(v.id,v));           // date posée à la main, échue
  all.filter(v=>inWin(v)&&!waiting(v)).forEach(v=>set.set(v.id,v));
  const l=[...set.values()];
  l.sort((a,b)=>{
    if(!!b.pin!==!!a.pin) return a.pin?-1:1;
    if(prioSort==="echeance"){
      const ad=dueByHand(a), bd=dueByHand(b);
      if(ad!==bd) return ad?-1:1;
      const x=mUntil(a.month), y=mUntil(b.month);
      if(x===null&&y!==null) return 1; if(y===null&&x!==null) return -1;
      if(x!==null&&x!==y) return x-y;
    }else{
      const la=last(a.id), lb=last(b.id);
      const da=la?days(la.date):9999, dbb=lb?days(lb.date):9999;
      if(da!==dbb) return dbb-da;
    }
    return a.name.localeCompare(b.name,"fr");
  });
  return l;
}

function missingList(){
  return [...venues.values()]
    .filter(v=>v.status!=="mort"&&v.status!=="valide"&&!reachable(v)&&(v.pin||actionable(v)))
    .sort((a,b)=>{
      if(!!b.pin!==!!a.pin) return a.pin?-1:1;
      const x=mUntil(a.month), y=mUntil(b.month);
      if(x===null&&y!==null) return 1; if(y===null&&x!==null) return -1;
      if(x!==null&&x!==y) return x-y;
      return a.name.localeCompare(b.name,"fr");
    });
}

function gigs(){
  return [...venues.values()].filter(v=>v.status==="valide")
    .sort((a,b)=>(a.gigDate||"9999")<(b.gigDate||"9999")?-1:1);
}

function linkLine(){

}
function greet(v){
  const p=peopleOf(v.id).find(x=>x.name&&/^[A-ZÉÈÀ]/.test(x.name));
  if(p) return "Bonjour "+p.name.split(" ")[0]+",";
  if(v.contact&&/^[A-ZÉÈÀ]/.test(v.contact)) return "Bonjour "+v.contact.split(" ")[0]+",";
  return "Bonjour,";
}
function tplFull(v){
  const lg=logsOf(v.id), l=lg[0];
  const relance = l && days(l.date)>60;
  const intro = relance
    ? "Je me permets de revenir vers vous : nous vous avions écrit le "+fmtL(l.date)+" et je ne suis pas sûr que le message vous soit parvenu."
    : (settings.pitch||SETTINGS_DEF.pitch);
  const p=peopleOf(v.id).find(x=>x.via);
  const pont = p ? "\n\n"+p.via+", de notre groupe, connaît "+p.name+" — c'est par là que nous arrivons jusqu'à vous." : "";
  const quand = v.month ? "\n\nNous visons l'édition de "+MONTHS[v.month-1]+"." : "";
  return "Objet : September Again \u2014 proposition de date"+(v.city?" \u00E0 "+v.city:"")+"\n\n"+
    greet(v)+"\n\n"+intro+pont+
    "\n\n"+(settings.corps||SETTINGS_DEF.corps)+", et "+v.name+" fait partie des lieux où nous aimerions jouer."+quand+
    "\n\nDe quoi vous faire une idée :\n"+linkLine()+
    "\n\nEst-ce que vous prenez des candidatures en ce moment, et sous quelle forme ?\n\nMerci pour votre temps,\n"+me+"\nSeptember Again \u2014 "+boite();
}
function tplBlank(v){

}

function digest(nDays){
  const acts=sinceDays(nDays);
  const pr=prioList(), miss=missingList(), gg=gigs();
  const par={}; acts.forEach(a=>{par[a.who]=(par[a.who]||0)+1;});
  let t="September Again \u2014 point démarchage du "+fmtL(todayISO)+"\n";
  t+="=".repeat(46)+"\n\n";

  t+="CE QUI A ÉTÉ FAIT ces "+nDays+" derniers jours\n";
  if(!acts.length) t+="  Rien. Personne n'a touché au fichier.\n";
  else{
    t+="  "+Object.keys(par).map(k=>k+" : "+par[k]).join("   ")+"\n\n";
    acts.slice(0,20).forEach(a=>{ t+="  \u00B7 "+a.who+" \u2014 "+a.what+"\n"; });
    if(acts.length>20) t+="  ... et "+(acts.length-20)+" autres.\n";
  }

  t+="\nÀ RELANCER MAINTENANT ("+pr.length+")\n";
  if(!pr.length) t+="  Rien d'urgent.\n";
  else pr.slice(0,10).forEach(v=>{
    const c=contactOf(v), l=last(v.id);
    t+="  \u00B7 "+v.name+(v.city?" ("+v.city+")":"")+(v.pin?" \u2605":"")+
       (v.month?" \u2014 édition en "+MONTHS[v.month-1]:"")+
       (l?", silence "+days(l.date)+" j":", jamais contacté")+
       (c?"":"  [AUCUN CONTACT]")+"\n";
  });

  t+="\nCONTACT À TROUVER ("+miss.length+")\n";
  if(!miss.length) t+="  Tout le monde est joignable.\n";
  else{
    t+="  "+miss.slice(0,12).map(v=>v.name).join(", ")+(miss.length>12?", ...":"")+"\n";
    t+="  Tant que personne ne retrouve ces adresses, ces lieux sont hors jeu.\n";
  }

  t+="\nCONCERTS ACTÉS ("+gg.length+")\n";
  t+= gg.length ? gg.map(v=>"  \u00B7 "+v.name+" \u2014 "+(v.gigDate?fmtL(v.gigDate):"date à préciser")).join("\n")+"\n"
                : "  Aucun.\n";

  t+="\n"+venues.size+" lieux \u00B7 "+people.size+" personnes \u00B7 "+exchanges.length+" échanges consignés\n";
  return t;
}

}


function rowHTML(v){
  const l=last(v.id), st=state(v), op=openId===v.id, c=contactOf(v);
  const mo=v.month?'<span class="'+(v.monthAuto?'auto':'')+'" title="'+(v.monthAuto?'Mois déduit automatiquement':'')+'">'+MONTHS[v.month-1]+'</span>':'';
  const z=zoneOf(v);
  const showZ = z && norm(z)!==norm(v.city);
  const bits=[esc(v.type),v.city?esc(v.city):"",showZ?'<span class="zt">'+esc(zoneLabel(z))+'</span>':"",mo].filter(Boolean);
  const site = v.link&&v.link.trim()
    ? '<a class="cp go" href="'+esc(normUrl(v.link))+'" target="_blank" rel="noopener noreferrer" title="'+esc(v.link.trim())+'">'+esc(hostOf(v.link))+' \u2197</a>'

    ? '<span class="ct">'+(c.k==="tel"?"\u260E":"\u2709")+' '+esc(c.v)+'</span>'+
      (c.who?'<span class="pv">'+esc(c.who)+(c.via?" (via "+esc(c.via)+")":"")+'</span>':'')+
      '<button class="cp" data-copy="'+esc(c.v)+'">copier</button>'+site

    '<span><span class="rn">'+esc(v.name)+'</span>'+

  return h+'</div>';

function peopleBlock(v){
  const list=peopleOf(v.id);
  let h='<div class="ppl"><h4>Personnes</h4>';
  if(!list.length && pEdit!=="new") h+='<p class="hint" style="margin:0 0 9px">Aucune. Souvent c\u2019est pourtant la porte d\u2019entrée la plus simple.</p>';
  list.forEach(p=>{
    if(pEdit===p.id){ h+=personForm(p,v.id); return; }
    const others=(p.venueIds||[]).filter(x=>x!==v.id).map(x=>venues.get(x)).filter(Boolean);
    h+='<div class="pc">'+
      '<span class="nm">'+esc(p.name)+'</span>'+
      (p.role?'<span class="ro">'+esc(p.role)+'</span>':'')+
      (pContact(p)?'<span class="co">'+esc(pContact(p))+'</span><button class="cp" data-copy="'+esc(pContact(p))+'">copier</button>':'<span class="ro">pas de coordonnées</span>')+
      (p.via?'<span class="via">via '+esc(p.via)+'</span>':'')+
      '<span class="sp"></span>'+
      (others.length?'<span class="also">aussi : '+others.map(o=>esc(o.name)).join(", ")+'</span>':'')+
      '<button class="mini" data-pedit="'+p.id+'">modifier</button>'+
      '<button class="mini" data-punlink="'+p.id+'">détacher</button>'+
      '<button class="mini" data-pdel="'+p.id+'">supprimer</button>'+
    '</div>';
  });
  if(pEdit==="new") h+=personForm(null,v.id);
  else{
    const free=[...people.values()].filter(p=>(p.venueIds||[]).indexOf(v.id)<0).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
    h+='<div class="acts" style="margin-top:10px"><button class="b o s" data-a="pnew">+ Ajouter une personne</button>'+
      (free.length?'<select class="mini" id="plink" style="padding:5px 8px"><option value="">rattacher quelqu\u2019un d\u2019existant…</option>'+
        free.map(p=>'<option value="'+p.id+'">'+esc(p.name)+(p.role?" — "+esc(p.role):"")+'</option>').join("")+'</select>':'')+
      '</div>';
  }
  return h+'</div>';
}

function personForm(p,venueId){
  const f=p||{name:"",role:"",email:"",phone:"",via:"",notes:""};
  const F=(id,l,v,ph)=>'<div class="f"><label for="'+id+'">'+l+'</label><input id="'+id+'" value="'+esc(v)+'"'+(ph?' placeholder="'+ph+'"':'')+'></div>';
  return '<div class="pform"><div class="fields">'+
    F("p-name","Nom",f.name,"prénom nom")+
    F("p-role","Son rôle",f.role,"programmateur, bénévole, ami…")+
    F("p-email","Mail",f.email)+F("p-phone","Téléphone",f.phone)+

      '<option value="">personne en particulier</option>'+
      MEM().map(m=>'<option'+(f.via===m?' selected':'')+'>'+m+'</option>').join("")+
      '<option'+(f.via==="quelqu\u2019un d\u2019autre"?' selected':'')+'>quelqu\u2019un d\u2019autre</option></select></div>'+

    '</div><div class="acts" style="margin-top:10px">'+

function appHTML(){
  let all=[...venues.values()];
  if(query.trim()){ const q=query.toLowerCase();
    all=all.filter(v=>(v.name+" "+v.city+" "+zoneOf(v)+" "+v.type+" "+(v.contact||"")+" "+(v.email||"")+" "+(v.notes||"")).toLowerCase().includes(q)); }
  if(monthFilter==="none") all=all.filter(v=>!v.month);
  else if(monthFilter!==null) all=all.filter(v=>v.month===monthFilter);
  if(zoneFilter) all=all.filter(v=>(zoneOf(v)||"?")===zoneFilter);

  let h="";
  if(sessionLog.length)
    h+='<div class="share"><span><b>'+sessionLog.length+' changement'+(sessionLog.length>1?'s':'')+'</b> depuis que tu as ouvert la page.</span>'+
       '<button class="b o s" data-a="share">Partager par mail</button>'+
       '<button class="mini" data-a="sharedone">plus tard</button></div>';
  h+=timelineHTML()+zoneBarHTML()+prioHTML()+
    '<div class="bar2"><input class="q" id="q" placeholder="Chercher un nom, une ville, une adresse…" value="'+esc(query)+'"></div>';

  GROUPS.forEach(g=>{
    const list=all.filter(v=>group(v)===g.k).sort((a,b)=>{
      if(!!b.pin!==!!a.pin) return a.pin?-1:1;
      const [x1,y1]=rank(a),[x2,y2]=rank(b);
      if(x1!==x2) return x1-x2; if(y1!==y2) return y1-y2;
      return a.name.localeCompare(b.name,"fr");
    });
    if(!list.length&&(g.k==="plustard"||g.k==="regle")) return;
    const col=collapsed[g.k];
    h+='<section class="grp" id="g-'+g.k+'"><button class="ghead" data-g="'+g.k+'">'+
       '<h2>'+g.t+'</h2><span class="n">'+list.length+'</span><span class="gs">'+(col?"afficher":"masquer")+'</span></button>'+
       (col?'':'<p class="gsub">'+g.s+'</p><div class="rows">'+
         (list.length?list.map(rowHTML).join(""):'<p class="hint" style="padding:16px 11px">Personne ici.</p>')+'</div>')+
       '</section>';
  });

  h+='<div class="foot"><span>'+venues.size+' lieux \u00B7 '+people.size+' personnes \u00B7 '+exchanges.length+' échanges \u00B7 '+
     (dbMode==="local"?'<b style="color:var(--amber)">'+dbLabel()+'</b>':esc(dbLabel()))+'</span>'+
     '<span><button class="lnk" data-a="links">'+esc(boite())+'</button></span><button class="lnk" data-a="data">Sauvegarde</button></div>';
  return h;
}

function blankForm(txt){
  const t=txt||"", low=t.toLowerCase();
  const lines=t.split("\n").map(x=>x.trim()).filter(Boolean);

  const em=t.match(/[\w.+-]+@[\w-]+\.[\w.]{2,}/);
  const url=t.match(/https?:\/\/[^\s<>"']+/);
  const ph=t.match(/(?:(?:\+33|\+41|0)[\s.-]?[1-9])(?:[\s.-]?\d{2}){4}/);

  // nom : première ligne qui ne soit ni un mail, ni une URL, ni un numéro
  let name="";
  for(const l of lines){
    if(/^[\w.+-]+@/.test(l)||/^https?:/i.test(l)) continue;
    if(/^[\d\s.+-]{8,}$/.test(l)) continue;
    name=l.replace(/[,;:.]+$/,"").slice(0,70); break;
  }

  // ville : on cherche celles qu'on connaît déjà
  let city="", country="FR";
  for(const k of Object.keys(CITY_ZONE)){
    if(low.indexOf(k)>=0){
      city=k.replace(/\s*\(\d+\)$/,"").replace(/\b\w/g,c=>c.toUpperCase());
      const z=CITY_ZONE[k];
      if(!/^\d+$/.test(z)) country="CH";
      break;
    }
  }
  if(/\b(suisse|schweiz|valais|vaud|genève|geneve)\b/.test(low)) country="CH";

  // mois : nom de mois écrit en toutes lettres
  let month=null;
  MONTHS.forEach((m,i)=>{ if(month===null&&low.indexOf(m)>=0) month=i+1; });

  // type : d'après les mots du texte
  let type="Festival";
  if(/\bfestival\b|\bfest\b|open air/.test(low)) type="Festival";
  else if(/\bsmac\b/.test(low)) type="SMAC";
  else if(/\bbar\b|\bcaf[ée]\b|\bpub\b|\bbistro/.test(low)) type="Café-concert";
  else if(/\bassociation\b|\basso\b/.test(low)) type="Asso";
  else if(/\bsalle\b|\bth[ée][âa]tre\b|\bmjc\b/.test(low)) type="Salle";

  return {name,type,city,country,month,
    email:em?em[0]:"", phone:ph?ph[0].trim():"", link:url?url[0]:"",
    contact:"", notes:""};
}

function findDupe(n){
  const a=norm(n); if(a.length<3) return null;
  for(const v of venues.values()){ const b=norm(v.name);
    if(b===a||(b.length>3&&a.length>3&&(b.includes(a)||a.includes(b)))) return v; }
  return null;
}

async function delVenue(id){
  const v=venues.get(id); if(!v) return;
  const logs=logsOf(id);
  // on détache d'abord la fiche des personnes, sinon elles gardent un lien mort
  for(const p of peopleOf(id)){
    const ids=(p.venueIds||[]).filter(x=>x!==id);
    p.venueIds=ids; people.set(p.id,p);
    if(db){ try{ await db.doc("people/"+p.id).update({venueIds:ids}); }catch(e){} }
  }
  exchanges=exchanges.filter(e=>e.venueId!==id);
  venues.delete(id);
  if(db){
    for(const e of logs){ try{ await db.doc("exchanges/"+e.id).delete(); }catch(err){} }
    try{ await db.doc("venues/"+id).delete(); }catch(e){}
  }
  await track("a supprimé "+v.name+(logs.length?" ("+logs.length+" échange(s) effacé(s))":""));
  if(openId===id) openId=null;
  render();
}

/* On ouvre le webmail qui correspond à l'adresse du groupe, telle qu'elle est
   réglée dans la page. Si le domaine n'est pas reconnu, on retombe sur mailto:. */
function mailHost(){
  const d=(boite().split("@")[1]||"").toLowerCase();
  if(/outlook|hotmail|live|msn/.test(d)) return "outlook";
  if(/gmail|googlemail/.test(d)) return "gmail";
  return "";
}
function mailLabel(){
  const h=mailHost();
  return h==="outlook"?"Outlook":h==="gmail"?"Gmail":"ton client mail";
}
function compose(to,subject,body){
  const q=encodeURIComponent, b=q(body.slice(0,1800)), h=mailHost();
  if(h==="outlook")
    return "https://outlook.live.com/mail/0/deeplink/compose?to="+q(to||"")+"&subject="+q(subject)+"&body="+b;
  if(h==="gmail")
    return "https://mail.google.com/mail/?view=cm&fs=1&to="+q(to||"")+"&su="+q(subject)+"&body="+b;
  return mailtoLink(to,subject,body);
}
function mailtoLink(to,subject,body){
  const q=encodeURIComponent;
  return "mailto:"+q(to||"")+"?subject="+q(subject)+"&body="+q(body.slice(0,1600));
}
function splitDraft(t){
  const ls=t.split("\n"), i=ls.findIndex(x=>/^objet\s*:/i.test(x.trim()));
  return i>=0
    ? {subject:ls[i].replace(/^objet\s*:/i,"").trim(), body:ls.slice(i+1).join("\n").trim()}
    : {subject:"September Again \u2014 groupe de rock d\u2019Annecy", body:t};
}

function fillMe(){
  const sel=$("#me"); if(!sel) return;
  const list=MEM();
  if(list.indexOf(me)<0){ me=list[0]; try{ localStorage.setItem("sa_me",me); }catch(e){} }
  const sig=list.join("\u0001")+"\u0002"+me;
  if(sel.dataset.sig===sig) return;          // ne pas reconstruire pour rien
  sel.dataset.sig=sig;
  sel.innerHTML=list.map(m=>'<option'+(m===me?' selected':'')+'>'+esc(m)+'</option>').join("");
}
function render(){
  const app=$("#app"); if(!app) return;
  fillMe();
  // on note où était le curseur pour le remettre après coup, au lieu d'annuler le rendu
  const ae=document.activeElement;
  let keep=null;
  if(ae&&ae.id&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)){
    keep={id:ae.id,
          start:(typeof ae.selectionStart==="number")?ae.selectionStart:null,
          end:(typeof ae.selectionEnd==="number")?ae.selectionEnd:null};
  }
  try{
    app.innerHTML=appHTML();
    $("#nav").innerHTML=navHTML();
    $("#side").innerHTML=sideHTML();
    $("#modal").innerHTML=modalHTML();
    wire();
  }catch(e){ fail("affichage",e); return; }
  if(keep){
    const el=document.getElementById(keep.id);
    if(el){
      try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(e2){} }
      if(keep.start!==null&&el.setSelectionRange){
        try{ el.setSelectionRange(keep.start,keep.end); }catch(e){}
      }
    }
  }
}

async function act(a){
  const v=openId?venues.get(openId):null;
  switch(a){
    case "nodraft": draft=""; draftMsg=""; render(); break;
    case "fields": openFields=!openFields; render(); break;
    case "pnew": pEdit="new"; render(); break;
    case "pcancel": pEdit=null; render(); break;
    case "later": await patch(v.id,{snooze:plus(21)}); await track("a mis "+v.name+" de côté pour trois semaines"); openId=null; render(); break;
    case "drop": await patch(v.id,{status:"mort"}); await track("a laissé tomber "+v.name); render(); break;
    case "won": await patch(v.id,{status:"valide"}); await track("A UNE DATE : "+v.name); render(); break;
    case "reopen": await patch(v.id,{status:"contacte",snooze:null}); render(); break;
    case "addlog": {
      const n=$("#x-note"); if(!n||!n.value.trim()){ if(n) n.focus(); return; }
      await addLog(v.id,$("#x-date").value,$("#x-chan").value,n.value.trim());
      if(v.status==="a_contacter") await patch(v.id,{status:"contacte"});
      await track(v.name+" : "+n.value.trim().slice(0,70));
      render(); break;
    }
    case "sent": {
      const t=($("#dbox")||{value:draft}).value;
      try{ await navigator.clipboard.writeText(t); }catch(e){}
      const first=(t.split("\n").find(x=>x.trim()&&!/^objet\s*:/i.test(x.trim()))||"Mail envoyé").slice(0,120);
      await addLog(v.id,todayISO,"mail",first);
      if(v.status==="a_contacter") await patch(v.id,{status:"contacte"});
      await track("a écrit à "+v.name);
      draft=""; draftMsg=""; render(); break;
    }
    case "open": modal="add"; addForm=null; addMsg=""; addDupe=null; render(); break;
    case "close": modal=null; addForm=null; addRaw=""; addMsg=""; delTarget=null; delPTarget=null; render(); break;
    case "askdel": delTarget=openId; modal="del"; render(); break;
    case "dodelp": { const id=delPTarget; modal=null; delPTarget=null; await delPerson(id); break; }
    case "dodel": { const id=delTarget; modal=null; delTarget=null; await delVenue(id); break; }
    case "parse": parseNew(); break;
    case "blank": addForm=blankForm(addRaw); addDupe=findDupe(addForm.name); render(); break;
    case "save": {
      const g=id=>{const e=$(id);return e?e.value.trim():"";};
      const mv=g("#n-month");
      const id=await saveNew({name:g("#n-name"),type:g("#n-type"),city:g("#n-city"),country:g("#n-country"),
        month:mv===""?null:parseInt(mv,10),email:g("#n-email"),phone:g("#n-phone"),link:g("#n-link"),
        contact:g("#n-contact"),notes:g("#n-notes")});
      modal=null; addForm=null; addRaw=""; addMsg=""; openId=id; collapsed.maintenant=false;
      await track("a ajouté "+(venues.get(id)||{}).name); render(); break;
    }
    case "clearmo": monthFilter=null; render(); break;
    case "clearzone": zoneFilter=null; render(); break;
    case "sort-echeance": prioSort="echeance"; render(); break;
    case "sort-silence": prioSort="silence"; render(); break;
    case "tpl-full":  draft=tplFull(v); draftMsg=""; render(); break;
    case "tpl-blank": draft=tplBlank(v); draftMsg=""; render(); break;
    case "outlook": case "mailto": {
      const t=($("#dbox")||{value:draft}).value, sp=splitDraft(t);
      const to=(v.email||"").trim()||(peopleOf(v.id).find(p=>p.email&&p.email.trim())||{}).email||"";
      const okOpen=openUrl(a==="outlook"?compose(to,sp.subject,sp.body):mailtoLink(to,sp.subject,sp.body));
      draftMsg=okOpen
        ? "Fenêtre ouverte. Reviens cliquer « Copier et consigner » pour garder la trace."
        : "!Le navigateur a bloqué l\u2019ouverture. Utilise « Copier et consigner », puis colle dans ton mail.";
      render(); break;
    }
    case "links": modal="links"; render(); break;
    case "lsave": {
      const nx={}; LINKDEFS.forEach(d=>{ const e=$("#l-"+d.k); nx[d.k]=e?e.value.trim():""; });
      const g=id=>{const e=$(id);return e?e.value.trim():"";};
      const mem=g("#s-membres").split(",").map(x=>x.trim()).filter(Boolean);
      const ns={members:mem.length?mem:MEMBERS_DEF.slice(),
                boite:g("#s-boite")||SETTINGS_DEF.boite, pitch:g("#s-pitch")||SETTINGS_DEF.pitch, corps:g("#s-corps")||SETTINGS_DEF.corps};
      const mailChanged=ns.boite!==settings.boite;
      links=nx; settings=ns; modal=null;
      if(db){
        try{ await db.doc("meta/links").set(links); }catch(e){}
        try{ await db.doc("meta/settings").set(settings); }catch(e){}
      }
      await track("a mis à jour les réglages du groupe"+(mailChanged?" (adresse : "+ns.boite+")":""));
      render(); break;
    }
    case "months": modal="months"; render(); break;
    case "weekly": modal="weekly"; render(); break;
    case "wcopy": {
      try{ await navigator.clipboard.writeText($("#wbox").value); $("#wmsg").textContent="Copié."; }
      catch(e){ $("#wmsg").textContent="Copie impossible, sélectionne le texte à la main."; }
      break;
    }
    case "wsend": {
      const t=$("#wbox").value;
      try{ await navigator.clipboard.writeText(t); }catch(e){}
      openUrl(compose(boite(),"Point démarchage \u2014 "+fmtL(todayISO),t));
      $("#wmsg").textContent="Bilan copié aussi, au cas où il serait tronqué.";
      break;
    }
    case "share": {
      const t=shareText();
      try{ await navigator.clipboard.writeText(t); }catch(e){}
      openUrl(compose(boite(),"Démarchage \u2014 mise à jour de "+me,t));
      sessionLog=[]; render(); break;
    }
    case "sharedone": sessionLog=[]; render(); break;
    case "export": await doExport(); break;
    case "data": modal="data"; impMsg=""; render(); break;
    case "backup": await doBackup(); break;
    case "dorestore": {
      const box=$("#imp-box"), file=$("#imp-file");
      let txt=box?box.value.trim():"";
      if(!txt&&file&&file.files&&file.files[0]){
        try{ txt=await file.files[0].text(); }catch(e){ impMsg="!Lecture du fichier impossible."; render(); break; }
      }
      if(!txt){ impMsg="!Choisis un fichier ou colle le JSON."; render(); break; }
      let obj; try{ obj=JSON.parse(txt); }catch(e){ impMsg="!Ce n\u2019est pas du JSON valide."; render(); break; }
      impMsg="Restauration en cours\u2026"; render();
      try{ const r=await importDump(obj,!!($("#imp-rep")&&$("#imp-rep").checked));
        impRaw=""; impMsg=r; render();
      }catch(e){ impMsg="!\u00C9chec : "+((e&&e.message)||"?"); render(); }
      break;
    }
  }
}

/* ===================== amorçage ===================== */
let hardError=false;
function note(m,dur){ const b=$("#boot"); if(!b) return;
  if(hardError&&!dur) return;                 // ne pas masquer une erreur par un message d'attente
  if(dur) hardError=true;
  b.hidden=false; b.textContent=m;
}
function fail(where,e){
  const msg=(e&&(e.code||e.message))||String(e);
  note("Erreur ("+where+") : "+msg+"  \u2014 ouvre la console du navigateur (F12) pour le détail.",true);
  try{ console.error("[september-again]",where,e); }catch(x){}
}
function loadLocal(){
  venues=new Map(); exchanges=[]; people=new Map();
  SEED_PEOPLE.forEach(p=>people.set(p.id,{...p,venueIds:[...p.venueIds]}));
  SEED.forEach(s=>{ const {log,...v}=s; venues.set(v.id,{...v});
    (log||[]).forEach((e,i)=>exchanges.push({id:s.id+"_"+i,venueId:s.id,date:e.d,who:e.w,channel:e.c,note:e.n,guessed:!!e.g})); });
}
/* ===================== où sont rangées les données =====================
   Deux cas :
     partage  une base Firestore, si FIREBASE_CONFIG est renseigné en haut du fichier
     local    le navigateur seul — la page marche, mais rien n'est partagé
   Les deux exposent la même poignée de méthodes ; pour en brancher une autre
   (Supabase, CouchDB, un serveur à toi), il suffit d'écrire un troisième pilote
   avec les mêmes méthodes : doc(chemin).get/set/update/delete/acquire,
   et collection(nom).onSnapshot(callback). Rien d'autre dans la page n'y touche. */
let dbMode="local";

function localDriver(){
  const KEY="sa_store_v1";
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } };
  const write=o=>{ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} };
  const subs=[];
  const emit=col=>{
    const st=read();
    const docs=Object.keys(st).filter(k=>k.indexOf(col+"/")===0)
      .map(k=>({id:k.slice(col.length+1), data:()=>st[k]}));
    subs.filter(x=>x.col===col).forEach(x=>{ try{ x.cb({docs}); }catch(e){} });
  };
  try{ window.addEventListener("storage",e=>{ if(e.key===KEY) [...new Set(subs.map(x=>x.col))].forEach(emit); }); }catch(e){}
  const colOf=p=>p.split("/")[0];
  return {
    doc(path){ return {
      async get(){ const d=read()[path]; return {exists:d!==undefined, data:()=>d}; },
      async set(v){ const st=read(); st[path]=JSON.parse(JSON.stringify(v)); write(st); emit(colOf(path)); },
      async update(f){ const st=read(); st[path]={...(st[path]||{}),...JSON.parse(JSON.stringify(f))}; write(st); emit(colOf(path)); },
      async delete(){ const st=read(); delete st[path]; write(st); emit(colOf(path)); },
      async acquire(){ return {acquired:true}; }
    };},
    collection(col){ return { onSnapshot(cb){ subs.push({col,cb}); emit(col); return ()=>{}; } }; }
  };
}

function firebaseDriver(fs,store,cfg){
  const PFX=cfg.saPrefix||"";                       // pour cohabiter avec d'autres données
  const D=p=>{ const i=p.indexOf("/"); return fs.doc(store,PFX+p.slice(0,i),p.slice(i+1)); };
  const wrap=d=>({id:d.id,data:()=>d.data()});
  return {
    doc(path){ const ref=D(path); return {
      async get(){ const sn=await fs.getDoc(ref); return {exists:sn.exists(), data:()=>sn.data()}; },
      async set(v){ await fs.setDoc(ref,JSON.parse(JSON.stringify(v))); },
      async update(f){ await fs.setDoc(ref,JSON.parse(JSON.stringify(f)),{merge:true}); },
      async delete(){ await fs.deleteDoc(ref); },
      async acquire(o){
        const holder=(o&&o.holder)||"x", ttl=(o&&o.ttlMs)||60000;
        try{
          return await fs.runTransaction(store,async tx=>{
            const sn=await tx.get(ref), d=sn.exists()?sn.data():null, now=Date.now();
            if(d&&d.__lockUntil&&d.__lockUntil>now&&d.__lockBy!==holder) return {acquired:false};
            tx.set(ref,{__lockBy:holder,__lockUntil:now+ttl},{merge:true});
            return {acquired:true};
          });
        }catch(e){ return {acquired:false}; }
      }
    };},
    collection(col){ return { onSnapshot(cb,err){
      return fs.onSnapshot(fs.collection(store,PFX+col),
        sn=>cb({docs:sn.docs.map(wrap)}), e=>{ if(err) err(e); });
    } }; }
  };
}

let fbAuth=null, fbAuthM=null, account=null;

/* Rien ne s'ouvre tant que personne n'est identifié. Les comptes ne se créent pas
   ici : ils sont créés à la main dans la console Firebase, et la règle Firestore
   ne laisse passer que ceux-là. Une page ouverte par un inconnu ne voit rien. */
async function openDb(){
  if(FIREBASE_CONFIG){
    try{
      const base="https://www.gstatic.com/firebasejs/"+FIREBASE_SDK+"/";
      const [appM,fsM,authM]=await Promise.all([
        import(base+"firebase-app.js"),
        import(base+"firebase-firestore.js"),
        import(base+"firebase-auth.js")
      ]);
      const app=appM.initializeApp(FIREBASE_CONFIG);
      fbAuthM=authM; fbAuth=authM.getAuth(app);
      try{ await authM.setPersistence(fbAuth,authM.browserLocalPersistence); }catch(e){}
      account=await new Promise(res=>{ const off=authM.onAuthStateChanged(fbAuth,u=>{off();res(u);}); });
      if(!account){ dbMode="gate"; return null; }
      dbMode="firebase";
      return firebaseDriver(fsM,fsM.getFirestore(app),FIREBASE_CONFIG);
    }catch(e){
      note("Base partag\u00E9e injoignable ("+((e&&e.message)||"?")+") \u2014 la page bascule sur une copie locale.");
    }
  }
  dbMode="local";
  return localDriver();
}
function dbLabel(){
  if(dbMode==="firebase") return "base partag\u00E9e \u00B7 "+esc((account&&account.email)||"connect\u00E9");
  return "copie locale \u2014 rien n\u2019est partag\u00E9";
}

/* ---------- écran de connexion ---------- */
function gate(msg){
  $("#shell").hidden=true; $("#boot").hidden=true;
  const g=$("#gate"); g.hidden=false;
  g.innerHTML='<div class="gbox"><h2>September Again</h2>'+
    '<p>Le fichier de d\u00E9marchage contient les coordonn\u00E9es de gens qui nous ont r\u00E9pondu. '+
    'Il faut un compte pour l\u2019ouvrir.</p>'+
    '<div class="fields" style="border:none;padding-top:0;margin-top:0">'+
      '<div class="f" style="grid-column:1/-1"><label for="g-mail">Adresse</label>'+
        '<input id="g-mail" type="email" autocomplete="username"></div>'+
      '<div class="f" style="grid-column:1/-1"><label for="g-pass">Mot de passe</label>'+
        '<input id="g-pass" type="password" autocomplete="current-password"></div>'+
    '</div>'+
    '<div class="acts" style="margin-top:14px"><button class="b" id="g-in">Entrer</button>'+
      '<button class="b o s" id="g-forgot">Mot de passe oubli\u00E9</button></div>'+
    '<p class="msg'+(msg&&msg.charAt(0)==="!"?" err":"")+'" id="g-msg">'+esc((msg||"").replace(/^!/,""))+'</p>'+
    '</div>';
  const go=async()=>{
    const m=$("#g-mail").value.trim(), p=$("#g-pass").value;
    if(!m||!p){ $("#g-msg").textContent="Adresse et mot de passe."; return; }
    $("#g-msg").textContent="\u2026";
    try{ await fbAuthM.signInWithEmailAndPassword(fbAuth,m,p); location.reload(); }
    catch(e){
      const c=(e&&e.code)||"";
      $("#g-msg").className="msg err";
      $("#g-msg").textContent=/wrong-password|invalid-credential|user-not-found/.test(c)
        ? "Adresse ou mot de passe incorrect."
        : /too-many-requests/.test(c) ? "Trop de tentatives. R\u00E9essaie dans quelques minutes."
        : "\u00C9chec de la connexion ("+(c||"?")+").";
    }
  };
  $("#g-in").onclick=go;
  $("#g-pass").onkeydown=e=>{ if(e.key==="Enter") go(); };
  $("#g-forgot").onclick=async()=>{
    const m=$("#g-mail").value.trim();
    if(!m){ $("#g-msg").textContent="Mets ton adresse au-dessus d\u2019abord."; return; }
    try{ await fbAuthM.sendPasswordResetEmail(fbAuth,m); $("#g-msg").className="msg"; $("#g-msg").textContent="Mail de r\u00E9initialisation envoy\u00E9."; }
    catch(e){ $("#g-msg").className="msg err"; $("#g-msg").textContent="Envoi impossible ("+((e&&e.code)||"?")+")."; }
  };
  $("#g-mail").focus();
}
async function signOut(){
  try{ await fbAuthM.signOut(fbAuth); }catch(e){}
  location.reload();
}
/* ---------- sauvegarde et restauration ----------
   Un seul fichier JSON contient tout. C'est la copie de secours, et c'est aussi
   par là qu'une base vide se remplit. */
function dump(){
  return {
    format:"september-again/1",
    exporte:new Date().toISOString(),
    venues:[...venues.values()],
    people:[...people.values()],
    exchanges:exchanges.slice(),
    links:{...links},
    settings:{...settings}
  };
}
async function doBackup(){
  const data=JSON.stringify(dump(),null,1), name="september-again-"+todayISO+".json";
  try{ const u=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a=document.createElement("a"); a.href=u; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(e){ alert("T\u00E9l\u00E9chargement indisponible ici."); }
}
async function importDump(obj,replace){
  if(!obj||typeof obj!=="object") throw new Error("fichier illisible");
  const V=Array.isArray(obj.venues)?obj.venues:[];
  const Pp=Array.isArray(obj.people)?obj.people:[];
  const X=Array.isArray(obj.exchanges)?obj.exchanges:[];
  if(!V.length&&!Pp.length) throw new Error("aucun lieu dans le fichier");
  if(replace){
    for(const v of [...venues.values()]) { try{ await db.doc("venues/"+v.id).delete(); }catch(e){} }
    for(const p of [...people.values()]) { try{ await db.doc("people/"+p.id).delete(); }catch(e){} }
    for(const e of exchanges)            { try{ await db.doc("exchanges/"+e.id).delete(); }catch(er){} }
    venues=new Map(); people=new Map(); exchanges=[];
  }
  const jobs=[];
  Pp.forEach(p=>{ const r={...p,venueIds:p.venueIds||[]}; people.set(r.id,r); jobs.push(()=>db.doc("people/"+r.id).set(r)); });
  V.forEach(v=>{ venues.set(v.id,{...v}); jobs.push(()=>db.doc("venues/"+v.id).set(v)); });
  X.forEach(e=>{ exchanges.push({...e}); jobs.push(()=>db.doc("exchanges/"+e.id).set(e)); });
  if(obj.links&&Object.keys(obj.links).length){ links={...links,...obj.links}; jobs.push(()=>db.doc("meta/links").set(links)); }
  if(obj.settings&&Object.keys(obj.settings).length){ settings={...SETTINGS_DEF,...obj.settings}; jobs.push(()=>db.doc("meta/settings").set(settings)); }
  for(let i=0;i<jobs.length;i+=4) await Promise.all(jobs.slice(i,i+4).map(f=>f()));
  await track("a import\u00E9 "+V.length+" lieux et "+Pp.length+" personnes");
  render();
  return V.length+" lieux, "+Pp.length+" personnes, "+X.length+" \u00E9changes r\u00E9tablis.";
}

async function boot(){
  const sel=$("#me");
  fillMe();
  sel.onchange=()=>{ me=sel.value; localStorage.setItem("sa_me",me); render(); };
  $("#addbtn").onclick=()=>act("open");
  loadLocal();
  note("Ouverture\u2026");
  db=await openDb();
  if(dbMode==="gate"){ gate(""); return; }
  $("#boot").hidden=true; $("#shell").hidden=false;
  if(dbMode==="firebase"){
    const out=document.createElement("button");
    out.className="lnk"; out.textContent="Sortir";
    out.onclick=()=>signOut();
    $("#me").parentNode.appendChild(out);
  }
  render();
  if(!db){ render(); return; }
  try{ const ls=await db.doc("meta/links").get(); if(ls.exists&&ls.data()) links={...links,...ls.data()}; }catch(e){}
  try{ const st=await db.doc("meta/settings").get(); if(st.exists&&st.data()) settings={...SETTINGS_DEF,...st.data()}; }catch(e){}
  db.collection("activity").onSnapshot(s=>{
    activity=s.docs.map(d=>d.data()).filter(Boolean);
  },()=>{});
  let live=false,pend=null;
  db.collection("venues").onSnapshot(s=>{
    if(!s.docs.length&&!live) return;
    const m=new Map(); s.docs.forEach(d=>{const x=d.data();m.set(x.id||d.id,{...x,id:x.id||d.id});});
    venues=m; live=true; if(pend){ exchanges=pend; pend=null; } render();
  },()=>{});
  db.collection("people").onSnapshot(s=>{
    if(!s.docs.length&&!live) return;
    const m=new Map(); s.docs.forEach(d=>{const x=d.data();m.set(x.id||d.id,{...x,id:x.id||d.id,venueIds:x.venueIds||[]});});
    people=m; render();
  },()=>{});
  db.collection("exchanges").onSnapshot(s=>{
    const l=s.docs.map(d=>{const x=d.data();return {...x,id:x.id||d.id};});
    if(live){ exchanges=l; render(); } else pend=l;
  },()=>{});
}
function start(){
  window.addEventListener("error",e=>fail("script",e.error||e));
  window.addEventListener("unhandledrejection",e=>fail("réseau ou base",e.reason));
  try{ boot().catch(e=>fail("démarrage",e)); }
  catch(e){ fail("démarrage",e); }
  setTimeout(()=>{
    const a=$("#app");
    if(!hardError&&(!a||!a.innerHTML.trim()))
      note("Rien ne s\u2019est affiché, et aucune erreur n\u2019a été signalée. Regarde la console (F12).",true);
  },6000);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
})();
