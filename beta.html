<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 132 52'%3E%3Crect width='132' height='52' fill='%2323241F'/%3E%3Cg fill='%23E3F218'%3E%3Crect x='0' y='0' width='49' height='5'/%3E%3Crect x='83' y='0' width='49' height='5'/%3E%3Crect x='0' y='47' width='49' height='5'/%3E%3Crect x='83' y='47' width='49' height='5'/%3E%3Crect x='0' y='0' width='5' height='52'/%3E%3Crect x='127' y='0' width='5' height='52'/%3E%3C/g%3E%3Ctext x='66' y='39' text-anchor='middle' fill='%23E3F218' font-family='Arial' font-size='35' font-weight='900'%3EMNG%3C/text%3E%3C/svg%3E">
<title>MNG — beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>

:root{
  --case:#23241F; --panel:#2C2E27; --panel2:#34362E;
  --paint:#E3F218; --chalk:#EFEDE3; --dust:#8E9184;
  --rule:#3E4139; --flag:#E2622C; --go:#A8C46B; --ink:#23241F;
}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--case);color:var(--chalk);
  min-height:100dvh;
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-variation-settings:"wdth" 100;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
html{height:100%}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--paint);outline-offset:2px}

/* ================= ossature ================= */
#app{display:flex;flex-direction:column;height:100dvh;position:relative;overflow:hidden}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto
}
.top .titre{font-variation-settings:"wdth" 112,"wght" 800;font-size:21px;letter-spacing:-.02em}
.topd{display:flex;align-items:center;gap:10px}
.top .moi{color:var(--dust);font-size:13.5px;border-bottom:1px solid var(--rule);padding-bottom:1px}
.top .moi:hover{border-bottom-color:var(--paint)}
.top .moi b{color:var(--paint);font-variation-settings:"wght" 700}
.roue{color:var(--dust);font-size:18px;line-height:1;padding:2px 4px}
.roue:hover{color:var(--paint)}
.copiable{display:flex;align-items:center;gap:10px;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding:10px 0;font-size:14px}
.copiable .u{color:var(--dust);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.copiable button{color:var(--paint);font-size:13px;border:1px solid var(--rule);padding:5px 10px;white-space:nowrap}
.copiable button:hover{border-color:var(--paint)}
.mini2{color:var(--paint);font-size:13px;border:1px solid var(--rule);padding:7px 11px;margin-top:8px}
.bloc-ct{border-left:2px solid var(--rule);padding-left:11px;margin-bottom:14px}
/* défilement défini plus bas, une seule fois */
.pad{padding:14px 16px 26px}

/* ================= navigation basse ================= */
.tabs{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--rule);background:var(--panel);flex:0 0 auto;align-self:stretch;
  padding-bottom:env(safe-area-inset-bottom)
}
.tabs button{
  padding:12px 4px 14px;text-align:center;color:var(--dust);font-size:13px;
  border-top:2px solid transparent;margin-top:-1px
}
.tabs button[aria-current="true"]{color:var(--paint);border-top-color:var(--paint);font-variation-settings:"wght" 700}
.tabs .g{display:block;font-size:17px;line-height:1.1;margin-bottom:3px}

/* ================= listes ================= */
.hsec{
  display:flex;align-items:baseline;gap:9px;margin:22px 0 9px;
  font-variation-settings:"wdth" 106,"wght" 800;font-size:17px;letter-spacing:-.01em
}
.hsec:first-child{margin-top:4px}
.hsec .n{color:var(--dust);font-size:13.5px;font-variation-settings:"wdth" 88,"wght" 600}
.list{display:flex;flex-direction:column;gap:9px}
.row{
  display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:13px;
  width:100%;background:var(--panel);border:1px solid var(--rule);padding:12px 13px
}
.row:hover{border-color:var(--dust)}
.row[aria-current="true"]{border-color:var(--paint)}
.row .mois{
  text-align:center;border:1px solid var(--paint);color:var(--paint);padding:5px 0;
  font-variation-settings:"wdth" 88,"wght" 700;font-size:11.5px;line-height:1.15
}
.row .mois b{display:block;font-size:15px;font-variation-settings:"wdth" 96,"wght" 800}
.row .mois.actee{border-color:var(--go);color:var(--go)}
.row .mois.rien{border-color:var(--rule);color:var(--dust)}
.row .mois.rien b{font-size:15px}
.row .nom{font-variation-settings:"wght" 700;font-size:16px;letter-spacing:-.01em}
.row .sub{color:var(--dust);font-size:12.8px;margin-top:2px}
.row .etat{text-align:right;font-size:12.5px;font-variation-settings:"wdth" 86;max-width:104px;color:var(--paint)}
.row .etat.flag{color:var(--flag)}
.row .etat.go{color:var(--go)}
.row .etat.mou{color:var(--dust)}
.vide{color:var(--dust);font-size:14px;border:1px dashed var(--rule);padding:14px}
.alerte{border:1px solid var(--flag);border-left-width:3px;background:var(--panel);
  padding:11px 13px;margin-bottom:14px;font-size:13.8px}
.alerte b{color:var(--flag);font-variation-settings:"wght" 700}
.lnkj{color:var(--paint);font-size:13px;border-bottom:1px solid var(--rule)}
.bilan{display:block;width:100%;border:1px solid var(--rule);border-left:3px solid var(--paint);
  background:var(--panel);padding:13px 14px;margin-bottom:22px}
.bilan:hover{border-color:var(--paint)}
.bilan .bt{display:block;font-variation-settings:"wdth" 104,"wght" 800;font-size:16px;letter-spacing:-.01em}
.bilan .bn{display:block;color:var(--dust);font-size:13.3px;margin-top:5px}
.bilan .bn b{color:var(--chalk);font-variation-settings:"wght" 700}
.bilan .bg{display:block;color:var(--paint);font-size:13px;margin-top:9px}

/* titre de section cliquable */
button.hsec{width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:9px;
  border-bottom:1px solid var(--rule);padding-bottom:7px}
button.hsec:hover{border-bottom-color:var(--paint)}
button.hsec:hover .n{color:var(--paint)}
button.hsec .n{white-space:nowrap}
button.hsec .n b{font-variation-settings:"wght" 800;color:var(--chalk)}

/* barre de filtres */
.barre{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.barre .cherche{margin:0}
.filtrer{border:1px solid var(--rule);padding:11px 13px;font-size:14px;color:var(--dust);white-space:nowrap}
.filtrer.actif{border-color:var(--paint);color:var(--paint);font-variation-settings:"wght" 700}
.actifs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.actifs button{border:1px solid var(--paint);color:var(--paint);padding:5px 9px;font-size:12.5px}
.actifs button .x{color:var(--dust);margin-left:6px}
.actifs .raz{border-color:var(--rule);color:var(--dust)}

/* feuille de filtres */
.fgroupe{margin-bottom:18px}
.fgroupe h6{margin:0 0 7px;font-variation-settings:"wdth" 90,"wght" 700;font-size:13px;color:var(--dust)}
.bascule{display:flex;justify-content:space-between;align-items:center;width:100%;
  border:1px solid var(--rule);padding:12px 13px;font-size:14.5px;margin-bottom:8px}
.bascule[aria-pressed="true"]{border-color:var(--paint);color:var(--paint)}
.bascule .etat{color:var(--dust);font-size:13px}

/* filtres */
.cherche{
  width:100%;background:var(--panel);border:1px solid var(--rule);color:var(--chalk);
  font-family:inherit;font-size:15px;padding:11px 12px;margin-bottom:10px
}
.cherche::placeholder{color:var(--dust)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.chips button{border:1px solid var(--rule);padding:6px 11px;font-size:13px;color:var(--dust)}
.chips button[aria-pressed="true"]{border-color:var(--paint);color:var(--paint)}

/* bouton flottant */
.fab{
  position:absolute;right:16px;bottom:80px;z-index:5;
  background:var(--paint);color:var(--ink);font-variation-settings:"wght" 800;
  font-size:15px;padding:13px 17px;box-shadow:0 6px 20px rgba(0,0,0,.45)
}

/* ================= fiche ================= */
.nomlieu{font-variation-settings:"wdth" 112,"wght" 800;font-size:25px;line-height:1.12;letter-spacing:-.02em;margin:0}
.villelieu{color:var(--dust);font-size:14px;margin:4px 0 0}

.rl{position:relative;height:54px;margin:20px 0 0}
.rl .axis{position:absolute;left:0;right:0;top:27px;height:1px;background:var(--rule)}
.rl .win{position:absolute;top:13px;height:14px;background:rgba(227,242,24,.16);border-left:1px solid var(--paint);border-right:1px solid var(--paint)}
.rl .m{position:absolute;top:33px;transform:translateX(-50%);font-size:10.5px;color:var(--dust);font-variation-settings:"wdth" 72}
.rl .m.key{color:var(--chalk)}
.rl .edi{position:absolute;top:7px;transform:translateX(-50%);width:2px;height:26px;background:var(--chalk)}
.rl .edi b{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;font-variation-settings:"wdth" 80,"wght" 700;color:var(--chalk);white-space:nowrap}
.rl .now{position:absolute;top:3px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--paint)}
.phrase{font-variation-settings:"wdth" 104,"wght" 700;font-size:17.5px;line-height:1.3;margin:20px 0 0;letter-spacing:-.01em}
.phrase em{font-style:normal;color:var(--paint)}
.phrase em.flag{color:var(--flag)}
.phrase em.go{color:var(--go)}
.depuis{color:var(--dust);font-size:13.5px;margin-top:6px}

.btn{display:block;width:100%;text-align:center;background:var(--paint);color:var(--ink);font-variation-settings:"wght" 800;font-size:15.5px;padding:14px}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--rule);font-variation-settings:"wght" 600}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{background:var(--panel2);border-left:3px solid var(--rule);padding:10px 12px;font-size:13.5px;margin-top:16px}
.jourbox{border:1px solid var(--go);padding:12px 13px;margin-top:16px}
.jt{display:flex;justify-content:space-between;align-items:baseline;font-variation-settings:"wdth" 92,"wght" 700;font-size:13.5px;color:var(--go)}
.jadr{margin:9px 0 0;font-size:14px}
.jvide{margin:9px 0 0;font-size:13.5px;color:var(--dust)}
.jgrid{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:11px}
.jgrid span,.jct span{font-size:14.5px}
.jgrid small,.jct small{display:block;color:var(--dust);font-size:11.5px;font-variation-settings:"wdth" 86}
.jct{display:flex;flex-direction:column;gap:8px;margin-top:12px;border-top:1px solid var(--rule);padding-top:11px}
.jnote{margin:11px 0 0;font-size:13.5px;color:var(--dust)}
.jret{margin:11px 0 0;font-size:13.5px;color:var(--go);border-top:1px solid var(--rule);padding-top:10px}
.h4{font-variation-settings:"wdth" 90,"wght" 700;font-size:13.5px;color:var(--dust);margin:24px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.h4 .plus{color:var(--paint);font-size:13px;font-variation-settings:"wdth" 100,"wght" 600}

.ct{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule);width:100%;font-size:14.5px}
.ct:last-of-type{border-bottom:0}
.ct .g{color:var(--dust);font-size:14px;text-align:center}
.ct .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct .v small{display:block;color:var(--dust);font-size:12.3px;font-variation-settings:"wdth" 88}
.ct .miss{color:var(--flag)}
.ct .go{color:var(--paint);font-size:13px}
.ct.edit{border-bottom:1px solid var(--paint);padding:9px 0}
.ct.edit .box{background:var(--case);border:1px solid var(--rule);color:var(--chalk);font-family:inherit;font-size:14.5px;padding:8px 10px}
button.note{text-align:left;font-size:13.5px}
button.note:hover{border-left-color:var(--paint)}

.entree{border-left:3px solid var(--paint);background:var(--panel2);padding:11px 13px;margin-top:8px}
.entree+.entree{margin-top:7px}
.entree .qui{font-variation-settings:"wght" 700;font-size:15.5px}
.entree .via{color:var(--dust);font-size:12.8px;margin-top:2px}
.entree .liens{display:flex;gap:14px;margin-top:8px;font-size:13.5px}
.entree .liens button{color:var(--paint);border-bottom:1px solid var(--rule);padding:0}
.entree.vide{border-left-color:var(--rule)}
.entree.vide .qui{color:var(--dust);font-variation-settings:"wght" 600;font-size:14px}

.ev{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
.ev:last-child{border-bottom:0}
.ev .d{color:var(--dust);font-size:12.3px;font-variation-settings:"wdth" 78;padding-top:2px}
.ev .n span{display:block;color:var(--dust);font-size:12.3px;margin-top:2px}
.deplier{
  width:100%;border:1px solid var(--rule);padding:11px;margin-top:9px;
  color:var(--dust);font-size:13.5px;text-align:center
}
.deplier:hover{border-color:var(--paint);color:var(--paint)}

/* ================= feuille par-dessus ================= */
.voile{position:absolute;inset:0;background:rgba(15,16,13,.62);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.voile.on{opacity:1;pointer-events:auto}
.feuille{
  position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:82%;
  background:var(--panel);border-top:2px solid var(--paint);
  display:flex;flex-direction:column;transform:translateY(102%);transition:transform .22s ease
}
.feuille.on{transform:translateY(0)}
.feuille .fh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px 11px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.feuille .fh h5{margin:0;font-variation-settings:"wdth" 108,"wght" 800;font-size:18px;letter-spacing:-.01em}
.feuille .fh button{color:var(--paint);font-size:14px;font-variation-settings:"wght" 600}
.feuille .fb{overflow-y:auto;padding:6px 16px 24px}
.fld{margin-bottom:12px}
.fld label{display:block;color:var(--dust);font-size:12.3px;font-variation-settings:"wdth" 88;margin-bottom:4px}
.fld .box{background:var(--case);border:1px solid var(--rule);padding:10px 11px;font-size:15px}
.fld .box.ph{color:var(--dust)}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ================= adaptation ordinateur ================= */
/* ===== mise en page : un seul mécanisme de défilement =====
   Chaque colonne est une boîte flexible en hauteur fixe. L'entête ne bouge
   pas (flex:0 0 auto), le contenu défile (flex:1 1 auto + min-height:0).
   min-height:0 est indispensable : sans lui, un enfant flexible refuse de
   rétrécir sous la taille de son contenu, et rien ne défile. */
.marque{display:flex;align-items:center;justify-content:space-between;line-height:0}
.marque img{display:block;width:38px;height:auto;opacity:.9}
.marque-g{display:block}
.marque-g img{width:96px;opacity:1;margin-bottom:14px}
.ajouth{background:var(--paint);color:var(--ink);font-variation-settings:"wght" 800;
  font-size:13.5px;line-height:1;padding:8px 12px;white-space:nowrap}
#shell{height:100dvh;overflow:hidden}
.modbtn{color:var(--paint);font-size:14px;font-variation-settings:"wght" 600}
.modbtn:hover{text-decoration:underline}
.retour{color:var(--paint);font-size:14px;font-variation-settings:"wght" 600}

.colonne,.volet{display:flex;flex-direction:column;min-height:0;max-height:100%}
.colonne .top,.volet .top{flex:0 0 auto}
#scroll,.volet .dedans{flex:1 1 auto;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}

@media (min-width:900px){
  #app{flex-direction:row}
  .tabs{
    order:-1;grid-template-columns:none;grid-auto-rows:max-content;
    border-top:0;border-right:1px solid var(--rule);width:112px;padding:0 0 14px;flex:0 0 112px
  }
  .marque{padding:15px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:8px;justify-content:center}
  .ajouth{display:none}
  .tabs button{border-top:0;border-left:2px solid transparent;margin-top:0;padding:14px 6px}
  .tabs button[aria-current="true"]{border-top-color:transparent;border-left-color:var(--paint)}
  .colonne{width:400px;flex:0 0 400px;border-right:1px solid var(--rule);height:100%}
  .volet{flex:1 1 auto;min-width:0;height:100%}
  .volet .top{justify-content:flex-end}
  .retour{display:none}
  .fab{bottom:22px}
  .feuille{left:auto;right:0;width:520px;max-height:100%;top:0;bottom:0;
    border-top:0;border-left:2px solid var(--paint);transform:translateX(102%)}
  .feuille.on{transform:translateX(0)}
  .videpc{display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--dust);font-size:15px;padding:40px;text-align:center}
}

@media (max-width:899px){
  .marque{grid-column:1/-1;padding:7px 12px 6px;border-bottom:1px solid var(--rule)}
  .marque img{width:30px}
  .fab{display:none}
  .colonne{flex:1 1 auto;height:100%}
  .volet{position:absolute;inset:0;z-index:10;background:var(--case);display:none}
  .volet.on{display:flex}
  .volet .top{justify-content:space-between}
}
}

.boot{padding:40px 20px;text-align:center;color:var(--dust);font-size:14.5px}
[hidden]{display:none!important}          /* sinon un display: explicite reprend le dessus */
#gate{display:flex;justify-content:center;padding:44px 18px}
.gbox{background:var(--panel);border:1px solid var(--rule);padding:24px;max-width:420px;width:100%}
.gbox h2{margin:0 0 10px;font-variation-settings:"wdth" 110,"wght" 800;font-size:22px}
.gbox p{font-size:13.5px;color:var(--dust);line-height:1.55;margin:0}
.gbox .fields{margin-top:16px}
.gbox .acts{display:flex;gap:8px;margin-top:14px}
.gbox .acts .b{flex:1}
.fields .f{margin-bottom:12px}
.fields .f label{display:block;color:var(--dust);font-size:12.3px;margin-bottom:4px}
.fields .f input{width:100%;background:var(--case);border:1px solid var(--rule);color:var(--chalk);
  font-family:inherit;font-size:15px;padding:10px 11px}
.b{display:block;width:100%;text-align:center;background:var(--paint);color:var(--ink);
  font-family:inherit;font-variation-settings:"wght" 800;font-size:15px;padding:13px;border:0;cursor:pointer}
.b.o{background:transparent;color:var(--chalk);border:1px solid var(--rule);font-variation-settings:"wght" 600}
.b.o.s{font-size:14px;padding:11px}
.msg{font-size:13px;color:var(--dust);margin-top:10px}
.msg.err{color:var(--flag)}
.hint{color:var(--dust);font-size:13px}
.warn{border:1px solid var(--flag);color:var(--chalk);padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.btn.danger,.b.danger{background:var(--flag);color:var(--ink)}
.btn.ghost.danger{background:transparent;color:var(--flag);border-color:var(--flag)}

</style>
</head>
<body>
<div id="boot" class="boot">Chargement…</div>
<div id="gate" hidden></div>
<div id="shell" hidden>

}
function loadLocal(){
  venues=new Map(); exchanges=[]; people=new Map();
  SEED_PEOPLE.forEach(p=>people.set(p.id,{...p,venueIds:[...p.venueIds]}));
  SEED.forEach(s=>{ const {log,...v}=s; venues.set(v.id,{...v});
    (log||[]).forEach((e,i)=>exchanges.push({id:s.id+"_"+i,venueId:s.id,date:e.d,who:e.w,channel:e.c,note:e.n,guessed:!!e.g})); });
}
/* ===================== où sont rangées les données =====================
   Deux cas :
     partage  une base Firestore, si FIREBASE_CONFIG est renseigné en haut du fichier
     local    le navigateur seul — la page marche, mais rien n'est partagé
   Les deux exposent la même poignée de méthodes ; pour en brancher une autre
   (Supabase, CouchDB, un serveur à toi), il suffit d'écrire un troisième pilote
   avec les mêmes méthodes : doc(chemin).get/set/update/delete/acquire,
   et collection(nom).onSnapshot(callback). Rien d'autre dans la page n'y touche. */
let dbMode="local";

function localDriver(){
  const KEY="sa_store_v1";
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } };
  const write=o=>{ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} };
  const subs=[];
  const emit=col=>{
    const st=read();
    const docs=Object.keys(st).filter(k=>k.indexOf(col+"/")===0)
      .map(k=>({id:k.slice(col.length+1), data:()=>st[k]}));
    subs.filter(x=>x.col===col).forEach(x=>{ try{ x.cb({docs}); }catch(e){} });
  };
  try{ window.addEventListener("storage",e=>{ if(e.key===KEY) [...new Set(subs.map(x=>x.col))].forEach(emit); }); }catch(e){}
  const colOf=p=>p.split("/")[0];
  return {
    doc(path){ return {
      async get(){ const d=read()[path]; return {exists:d!==undefined, data:()=>d}; },
      async set(v){ const st=read(); st[path]=JSON.parse(JSON.stringify(v)); write(st); emit(colOf(path)); },
      async update(f){ const st=read(); st[path]={...(st[path]||{}),...JSON.parse(JSON.stringify(f))}; write(st); emit(colOf(path)); },
      async delete(){ const st=read(); delete st[path]; write(st); emit(colOf(path)); },
      async acquire(){ return {acquired:true}; }
    };},
    collection(col){ return { onSnapshot(cb){ subs.push({col,cb}); emit(col); return ()=>{}; } }; }
  };
}

function firebaseDriver(fs,store,cfg){
  const PFX=(typeof PFX_BETA!=="undefined"?PFX_BETA:"");                       // pour cohabiter avec d'autres données
  const D=p=>{ const i=p.indexOf("/"); return fs.doc(store,PFX+p.slice(0,i),p.slice(i+1)); };
  const wrap=d=>({id:d.id,data:()=>d.data()});
  return {
    doc(path){ const ref=D(path); return {
      async get(){ const sn=await fs.getDoc(ref); return {exists:sn.exists(), data:()=>sn.data()}; },
      async set(v){ await fs.setDoc(ref,JSON.parse(JSON.stringify(v))); },
      async update(f){ await fs.setDoc(ref,JSON.parse(JSON.stringify(f)),{merge:true}); },
      async delete(){ await fs.deleteDoc(ref); },
      async acquire(o){
        const holder=(o&&o.holder)||"x", ttl=(o&&o.ttlMs)||60000;
        try{
          return await fs.runTransaction(store,async tx=>{
            const sn=await tx.get(ref), d=sn.exists()?sn.data():null, now=Date.now();
            if(d&&d.__lockUntil&&d.__lockUntil>now&&d.__lockBy!==holder) return {acquired:false};
            tx.set(ref,{__lockBy:holder,__lockUntil:now+ttl},{merge:true});
            return {acquired:true};
          });
        }catch(e){ return {acquired:false}; }
      }
    };},
    collection(col){ return { onSnapshot(cb,err){
      return fs.onSnapshot(fs.collection(store,PFX+col),
        sn=>cb({docs:sn.docs.map(wrap)}), e=>{ if(err) err(e); });
    } }; }
  };
}

let fbAuth=null, fbAuthM=null, account=null;

/* Rien ne s'ouvre tant que personne n'est identifié. Les comptes ne se créent pas
   ici : ils sont créés à la main dans la console Firebase, et la règle Firestore
   ne laisse passer que ceux-là. Une page ouverte par un inconnu ne voit rien. */
function configOf(){
  if(typeof window!=="undefined" && window.SA_FIREBASE) return window.SA_FIREBASE;
  const c=FIREBASE_CONFIG;
  return (c && typeof c.apiKey==="string" && c.apiKey.trim()) ? c : null;
}
async function openDb(){
  const cfg=configOf();
  if(cfg){
    try{
      const base="https://www.gstatic.com/firebasejs/"+FIREBASE_SDK+"/";
      const [appM,fsM,authM]=await Promise.all([
        import(base+"firebase-app.js"),
        import(base+"firebase-firestore.js"),
        import(base+"firebase-auth.js")
      ]);
      const app=appM.initializeApp(cfg);
      fbAuthM=authM; fbAuth=authM.getAuth(app);
      try{ await authM.setPersistence(fbAuth,authM.browserLocalPersistence); }catch(e){}
      account=await new Promise(res=>{ const off=authM.onAuthStateChanged(fbAuth,u=>{off();res(u);}); });
      if(!account){ dbMode="gate"; return null; }
      dbMode="firebase";
      return firebaseDriver(fsM,fsM.getFirestore(app),cfg);
    }catch(e){
      note("Base partag\u00E9e injoignable ("+((e&&e.message)||"?")+") \u2014 la page bascule sur une copie locale.");
    }
  }
  dbMode="local";
  return localDriver();
}
function dbLabel(){
  if(dbMode==="firebase") return "base partag\u00E9e \u00B7 "+esc((account&&account.email)||"connect\u00E9");
  return "copie locale \u2014 rien n\u2019est partag\u00E9";
}

/* ---------- sauvegarde et restauration ----------
   Un seul fichier JSON contient tout. C'est la copie de secours, et c'est aussi
   par là qu'une base vide se remplit. */

/* ============ l’application ============ */

/* ---------------- données réelles, extraites de ta base ---------------- */
const AUJ = new Date(); AUJ.setHours(0,0,0,0);
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOISC= ["j","f","m","a","m","j","j","a","s","o","n","d"];

const VENUES=[]; const EX=[]; const GENS=[];   // remplis par la base

/* secteurs : le même tableau que dans l'application */
const CITY_ZONE={
 "annecy":"74","annemasse":"74","cluses":"74","habère-poche":"74","thorens-glières":"74","bonneville":"74",
 "ambilly":"74","thonon-les-bains":"74","machilly":"74","thusy":"74",
 "bourgoin-jallieu":"38","grenoble":"38","ville-sous-anjou":"38",
 "lyon":"69","neuville-sur-saône":"69",
 "bourg-en-bresse":"01","sergy":"01","saint-maurice-de-gourdans":"01",
 "yenne":"73","aix-les-bains":"73","dôle":"39","mervans":"71","louhans":"71",
 "plan-les-ouates":"Genève","perly":"Genève","genève":"Genève","thônex":"Genève",
 "étagnières":"Vaud","gilly":"Vaud","nyon":"Vaud","lausanne":"Vaud",
 "neuchâtel":"Neuchâtel"
};
const NOMZONE={"74":"74 Haute-Savoie","73":"73 Savoie","38":"38 Isère","69":"69 Rhône",
 "01":"01 Ain","39":"39 Jura","71":"71 Saône-et-Loire","?":"secteur inconnu"};
const zoneOf=v=>(v.zone&&v.zone.trim())||CITY_ZONE[String(v.city||"").trim().toLowerCase()]||"?";
const nomZone=z=>NOMZONE[z]||z;

/* ---------------- calculs ---------------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const logs=id=>EX.filter(e=>e.v===id).sort((a,b)=>b.d.localeCompare(a.d));
let nextG=0;
const gens=id=>GENS.filter(g=>g.v===id);
function moisDepuis(iso){
  const d=new Date(iso);
  return Math.max(0,Math.round((AUJ-d)/(1000*60*60*24*30.44)));
}
function fenetre(v){                       // 4 à 8 mois avant l'édition
  if(!v.month) return null;
  const m=AUJ.getMonth()+1;
  let diff=v.month-m; if(diff<=0) diff+=12;
  return {diff, ouverte: diff>=4 && diff<=8};
}
function etat(v){
  const l=logs(v.id), dep=l.length?moisDepuis(l[0].d):null, f=fenetre(v);
  if(v.status==="valide") return {k:"go",court:"date obtenue",phrase:"Une date obtenue ici.",em:"go",
    sous:v.dateActee?("Le "+fmtDate(v.dateActee)+"."):"Date à préciser."};
  if(v.status==="a_contacter") return {k:"todo",court:"jamais écrit",phrase:"Personne ne leur a encore écrit.",em:"",sous:f?("Édition en "+MOIS[v.month-1]+"."):"Pas de mois d'édition renseigné."};
  if(dep!==null&&dep>=9) return {k:"flag",court:"sans réponse",phrase:"Sans réponse "+(f&&f.ouverte?"— et c'est le moment d'écrire.":"depuis "+dep+" mois."),em:"flag",
    sous:"Dernier contact il y a "+dep+" mois, par "+l[0].q+"."};
  return {k:"cours",court:"en cours",phrase:"Discussion en cours.",em:"",sous:l.length?("Dernier contact il y a "+dep+" mois, par "+l[0].q+"."):"Aucun échange consigné."};
}
/* La prochaine échéance : la date du prochain rendez-vous avec ce lieu,
   pas celle du dernier contact. Quatre paniers, du plus urgent au plus dormant. */
function moisPlus(d,k){ const x=new Date(d); x.setMonth(x.getMonth()+k); return x; }
function prochaineEdition(m){
  let y=AUJ.getFullYear();
  let d=new Date(y,m-1,1);
  if(d<AUJ) d=new Date(y+1,m-1,1);
  return d;
}
function echeance(v){
  const l=logs(v.id), dern=l.length?l[0].d:null;
  if(v.rappel&&v.status!=="valide"&&v.status!=="mort"){
    const r=new Date(v.rappel);
    return AUJ>=r ? {b:0,ts:r.getTime(),lab:"rappel du "+fmtDate(v.rappel)}
                  : {b:2,ts:r.getTime(),lab:"rappel le "+fmtDate(v.rappel)};
  }
  if(v.status==="valide"){
    const d=v.dateActee?new Date(v.dateActee):null;
    return {b:4,ts:d?d.getTime():4e12,lab:d?fmtDate(v.dateActee):"date obtenue"};
  }
  if(v.status==="mort") return {b:5,ts:4e12,lab:"laissé tomber"};

  if(v.month){
    let edi=prochaineEdition(v.month);
    let ouv=moisPlus(edi,-8), fer=moisPlus(edi,-4);
    /* une fenêtre a une date de fermeture : c'est la seule vraie échéance */
    if(AUJ>=ouv&&AUJ<=fer) return {b:0,ts:fer.getTime(),lab:"écrire avant "+fmtMois(fer)};
    if(AUJ<ouv)            return {b:2,ts:ouv.getTime(),lab:"à écrire en "+fmtMois(ouv)};
    edi=new Date(edi.getFullYear()+1,edi.getMonth(),1); ouv=moisPlus(edi,-8);
    return {b:2,ts:ouv.getTime(),lab:"trop tard · revoir en "+fmtMois(ouv)};
  }

  if(dern){
    const relance=moisPlus(new Date(dern),9), m=moisDepuis(dern);
    /* un silence n'a pas de date butoir : il passe après les fenêtres qui ferment */
    return AUJ>=relance
      ? {b:1,ts:relance.getTime(),lab:"silence depuis "+fmtMois(new Date(dern))}
      : {b:2,ts:relance.getTime(),lab:"relancer dans "+Math.max(1,9-m)+" mois"};
  }
  return {b:3,ts:5e12,lab:"jamais contacté"};
}
const MOISC4=["janv.","févr.","mars","avril","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fmtDate(iso){ const d=new Date(iso); return d.getDate()+" "+MOISC4[d.getMonth()]+" "+d.getFullYear(); }
function fmtMois(d){
  const a=d.getFullYear();
  return MOISC4[d.getMonth()]+(a!==AUJ.getFullYear()?" "+a:"");
}
const NOMTRI={echeance:"par échéance",silence:"sans nouvelles d'abord",secteur:"par secteur",alpha:"par nom"};
function trier(arr){
  const c=(a,b)=>a.name.localeCompare(b.name,"fr");
  if(tri==="alpha")   return arr.sort(c);
  if(tri==="secteur") return arr.sort((a,b)=>{
    const za=zoneOf(a),zb=zoneOf(b);
    if(za!==zb) return za==="?"?1:zb==="?"?-1:nomZone(za).localeCompare(nomZone(zb),"fr");
    return c(a,b);
  });
  if(tri==="silence") return arr.sort((a,b)=>{
    const la=logs(a.id), lb=logs(b.id);
    const da=la.length?la[0].d:"9999", db=lb.length?lb[0].d:"9999";   // jamais écrit ≠ sans nouvelles
    return da.localeCompare(db)||c(a,b);
  });
  return arr.sort((a,b)=>{
    if(!!a.pin!==!!b.pin) return a.pin?-1:1;      // ce que vous avez décidé passe devant
    const ea=echeance(a),eb=echeance(b);
    return ea.b-eb.b || ea.ts-eb.ts || c(a,b);
  });
}

function contacts(v){
  const out=[];
  if(v.mail) out.push({cle:"mail",g:"✉",t:"Mail",val:v.mail});
  if(v.tel)  out.push({cle:"tel", g:"☎",t:"Téléphone",val:v.tel});
  if(v.link) out.push({cle:"link",g:"↗",t:"Site",val:v.link});
  if(!v.mail) out.push({cle:"mail",g:"✉",t:"Mail",manque:true});
  if(!v.tel)  out.push({cle:"tel", g:"☎",t:"Téléphone",manque:true});
  if(!v.link) out.push({cle:"link",g:"↗",t:"Site",manque:true});
  return out;
}

/* ---------------- rendu des listes ---------------- */
function ligne(v,sel){
  const e=etat(v), m=v.month;
  return '<button class="row" data-id="'+v.id+'"'+(sel?' aria-current="true"':'')+'>'+
    (v.dateActee?(function(){const d=new Date(v.dateActee);
        return '<span class="mois actee">'+d.getDate()+' '+MOISC4[d.getMonth()]+'<b>'+d.getFullYear()+'</b></span>';})()
     :m?(function(){const d=prochaineEdition(m);
        return '<span class="mois">'+MOIS[m-1].slice(0,3)+'<b>'+d.getFullYear()+'</b></span>';})()
      :'<span class="mois rien">mois<b>—</b></span>')+
    '<span><span class="nom">'+(v.pin?'<span style="color:var(--paint)">\u2605 </span>':'')+esc(v.name)+'</span>'+
      '<span class="sub">'+esc(v.type)+(v.city?' · '+esc(v.city):'')+(zoneOf(v)!=="?"?' · '+esc(zoneOf(v)):'')+' · '+esc(v.owner)+'</span></span>'+
    (function(){
      if(tri==="echeance"){
        const h=echeance(v);
        return '<span class="etat '+(h.b<=1?"flag":h.b===4?"go":h.b>=3?"mou":"")+'">'+esc(h.lab)+'</span>';
      }
      if(tri==="silence"){
        const l=logs(v.id);
        return '<span class="etat '+(l.length?"":"mou")+'">'+(l.length?fmtMois(new Date(l[0].d)):"jamais écrit")+'</span>';
      }
      return '<span class="etat '+(e.em==="flag"?"flag":e.em==="go"?"go":e.k==="cours"?"mou":"")+'">'+esc(e.court)+'</span>';
    })()+
  '</button>';
}
function liste(arr,sel){
  return arr.length? '<div class="list">'+arr.map(v=>ligne(v,v.id===sel)).join("")+'</div>'
                   : '<p class="vide">Personne ici.</p>';
}

let moi="Loïc", modeleChoisi=0, ficheJour=null, canalChoisi="mail";

function lienTexte(){ return R.liens.slice(0,3).map(x=>x.l+" : "+x.u).join("\n"); }
function remplir(t,v){
  return t.replace(/\{groupe\}/g,R.groupe)
          .replace(/\{lieu\}/g,v.name)
          .replace(/\{ville\}/g,v.city?" à "+v.city:"")
          .replace(/\{liens\}/g,lienTexte());
}
const F0={preset:null,types:[],owners:[],etats:[],zones:[],manque:false,sansMois:false};
let F={...F0,types:[],owners:[],etats:[],zones:[]};
const PRESETS={
  relance:{l:"à relancer", f:v=>{const w=fenetre(v);return v.type==="Festival"&&w&&w.ouverte&&v.status!=="valide";}},
  prio:{l:"prioritaires", f:v=>!!v.pin},
  attente:{l:"en attente", f:v=>etat(v).k==="flag"||etat(v).k==="cours"},
  rappel:{l:"rappel posé", f:v=>!!v.rappel&&v.status!=="valide"&&v.status!=="mort"}
};
function nbFiltres(){
  return (F.preset?1:0)+F.types.length+F.owners.length+F.etats.length+F.zones.length+(F.manque?1:0)+(F.sansMois?1:0);
}
function appliquer(arr){
  if(F.preset&&PRESETS[F.preset]) arr=arr.filter(PRESETS[F.preset].f);
  if(F.manque)   arr=arr.filter(v=>!v.tel&&!v.mail);
  if(F.sansMois) arr=arr.filter(v=>!v.month);
  if(F.types.length)  arr=arr.filter(v=>F.types.includes(v.type));
  if(F.owners.length) arr=arr.filter(v=>F.owners.includes(v.owner));
  if(F.zones.length)  arr=arr.filter(v=>F.zones.includes(zoneOf(v)));
  if(F.etats.length)  arr=arr.filter(v=>F.etats.includes(etat(v).k));
  if(q) arr=arr.filter(v=>(v.name+" "+v.city).toLowerCase().includes(q.toLowerCase()));
  return arr;
}
function versExplorer(patch){
  F={...F0,types:[],owners:[],etats:[],zones:[],...patch};
  q=""; vue="explorer"; if(window.innerWidth<900) sel=null; rendre();
}

const APERCU=5;                       // on ne montre jamais plus que ça sur l'accueil
function bloc(titre,arr,patch){
  arr=trier(arr.slice());                        // même ordre que dans Lieux
  const vus=arr.slice(0,APERCU), reste=arr.length-vus.length;
  return '<button class="hsec" data-go=\''+JSON.stringify(patch)+'\'>'+
      '<span>'+titre+'</span>'+
      '<span class="n"><b>'+arr.length+'</b> ' + (reste>0?('· voir tout'):'voir') + ' →</span>'+
    '</button>'+
    liste(vus,sel)+
    (reste>0?'<button class="deplier" data-go=\''+JSON.stringify(patch)+'\'>'+reste+' autre'+(reste>1?'s':'')+' →</button>':'');
}
function vueAccueil(){
  const relance=VENUES.filter(PRESETS.relance.f);
  const prio=VENUES.filter(PRESETS.prio.f);
  const manque=VENUES.filter(v=>!v.tel&&!v.mail);
  if(!VENUES.length)
    return '<div class="warn" style="margin-bottom:18px"><b>La base d\'essai est vide.</b><br>'+
      'Charge ta sauvegarde pour commencer : ta production n\'est pas touchée, tout reste dans l\'espace beta.</div>'+
      '<button class="btn" data-import="1">Charger une sauvegarde</button>'+
      '<p class="hint" style="margin-top:10px">Depuis ton application en service : Sauvegarde · restauration → Télécharger la sauvegarde.</p>';
  const rappels=VENUES.filter(PRESETS.rappel.f);
  const echus=rappels.filter(v=>new Date(v.rappel)<=AUJ);
  return (echus.length
      ? '<div class="alerte"><b>'+echus.length+' rappel'+(echus.length>1?'s sont tombés':' est tombé')+'.</b> '+
        esc(echus.slice(0,3).map(v=>v.name).join(", "))+(echus.length>3?'\u2026':'')+
        ' <button class="lnkj" data-go=\'{"preset":"rappel"}\'>voir \u2192</button></div>'
      : '')+
    bilanHTML()+
    bloc("À relancer",relance,{preset:"relance"})+
    '<div style="height:16px"></div>'+
    bloc("Rappels posés",rappels,{preset:"rappel"})+
    '<div style="height:16px"></div>'+
    bloc("Prioritaires",prio,{preset:"prio"})+
    '<div style="height:16px"></div>'+
    bloc("Il manque le contact",manque,{manque:true});
}
function pastilles(){
  const p=[];
  if(F.preset&&PRESETS[F.preset]) p.push(['preset',null,PRESETS[F.preset].l]);
  if(F.manque)   p.push(['manque',null,'sans contact']);
  if(F.sansMois) p.push(['sansMois',null,'sans mois']);
  F.types.forEach(t=>p.push(['types',t,t]));
  F.owners.forEach(t=>p.push(['owners',t,t]));
  F.zones.forEach(t=>p.push(['zones',t,nomZone(t)]));
  F.etats.forEach(t=>p.push(['etats',t,{go:"date obtenue",todo:"jamais écrit",flag:"sans réponse",cours:"en cours"}[t]]));
  if(!p.length) return "";
  return '<div class="actifs">'+p.map(x=>'<button data-off="'+x[0]+'" data-val="'+esc(x[1]==null?"":x[1])+'">'+esc(x[2])+'<span class="x">×</span></button>').join("")+
    '<button class="raz" data-raz="1">tout enlever</button></div>';
}
function listeParSecteur(arr){
  let h="",z=null;
  arr.forEach(v=>{
    const zz=zoneOf(v);
    if(zz!==z){ z=zz; h+='<div class="hsec" style="margin-top:18px"><span>'+esc(nomZone(z))+'</span></div>'; }
    h+='<div class="list" style="margin-bottom:9px">'+ligne(v,v.id===sel)+'</div>';
  });
  return h||'<p class="vide">Personne ici.</p>';
}
function vueExplorer(){
  const arr=trier(appliquer(VENUES.slice()));
  const n=nbFiltres();
  return '<div class="barre">'+
      '<input class="cherche" id="q" placeholder="Chercher un lieu, une ville…" value="'+esc(q)+'">'+
      '<button class="filtrer'+(n?' actif':'')+'" data-f="filtres">Filtrer'+(n?' · '+n:'')+'</button>'+
      '<button class="filtrer" data-f="tri">Trier</button>'+
    '</div>'+

    '<div class="hsec"><span>'+arr.length+' lieu'+(arr.length>1?'x':'')+'</span>'+
      '<span class="n" style="font-variation-settings:\'wdth\' 88,\'wght\' 600">'+esc(NOMTRI[tri])+'</span></div>'+
    (tri==="secteur"?listeParSecteur(arr):liste(arr,sel));

function vueAgenda(){
  const d=VENUES.filter(v=>v.status==="valide")
    .sort((a,b)=>String(a.dateActee||"9").localeCompare(String(b.dateActee||"9")));

    liste(avenir,sel)+

    '<div class="hsec" style="margin-top:26px"><span>Le mois</span></div>'+

/* ---------------- rendu de la fiche ---------------- */
function regle(v){
  if(!v.month) return "";
  const pos=m=>((m-0.5)/12*100);
  const edi=v.month, deb=((edi-8)+12-1)%12+1, fin=((edi-4)+12-1)%12+1;
  const seg=(a,b)=>{
    const x1=pos(a),x2=pos(b);
    return x1<x2 ? '<span class="win" style="left:'+x1+'%;right:'+(100-x2)+'%"></span>'
                 : '<span class="win" style="left:'+x1+'%;right:0"></span><span class="win" style="left:0;right:'+(100-x2)+'%"></span>';
  };
  const now=AUJ.getMonth()+1;
  return '<div class="rl" role="img" aria-label="Fenêtre d\'écriture de '+MOIS[deb-1]+' à '+MOIS[fin-1]+', édition en '+MOIS[edi-1]+'.">'+
    '<span class="axis"></span>'+seg(deb,fin)+
    '<span class="edi" style="left:'+pos(edi)+'%"><b>édition</b></span>'+
    '<span class="now" style="left:'+pos(now)+'%"></span>'+
    MOISC.map((c,i)=>'<span class="m'+((i+1===edi||i+1===now)?' key':'')+'" style="left:'+pos(i+1)+'%">'+c+'</span>').join("")+
  '</div>';
}
function jourHTML(v){
  const J=v.jour||{}, cts=(J.contacts||[]).filter(c=>c.nom||c.tel||c.mail||c.role);
  const l=[["Arrivée",J.arrivee],["Balances",J.balances],["Show",J.show],["Durée",J.duree],["Rémunération",J.cachet]]
    .filter(x=>x[1]);
  const passe=v.dateActee&&new Date(v.dateActee)<AUJ;
  const RET={oui:"On y retourne",peut:"Peut-être qu'on y retourne",non:"On n'y retourne pas"};
  return '<div class="jourbox"><div class="jt">'+
      '<span>Le jour J</span><button class="plus" data-f="date">'+(l.length||cts.length?"modifier":"remplir")+'</button></div>'+
    (v.adresse?'<p class="jadr">'+esc(v.adresse)+'</p>':'')+
    (l.length?'<div class="jgrid">'+l.map(x=>'<span><small>'+x[0]+'</small>'+esc(x[1])+'</span>').join("")+'</div>'
             :(v.adresse?'':'<p class="jvide">Rien de renseigné pour l\'instant.</p>'))+
    (cts.length?'<div class="jct">'+cts.map(c=>'<span><small>'+esc(c.role||"contact")+'</small>'+
        esc(c.nom||"")+(c.tel?' · '+esc(c.tel):'')+(c.mail?' · '+esc(c.mail):'')+'</span>').join("")+'</div>':'')+
    (J.note?'<p class="jnote">'+esc(J.note)+'</p>':'')+
    (passe&&J.retour?'<p class="jret">'+esc(RET[J.retour])+(J.bilan?' — '+esc(J.bilan):'')+'</p>':'')+
    (passe&&!J.retour?'<button class="deplier" style="margin-top:10px" data-f="date">Comment c\'était ? On y retourne ?</button>':'')+
  '</div>';
}
function fiche(v){
  if(!v) return '<div class="videpc">Choisis un lieu dans la liste.</div>';
  const e=etat(v), l=logs(v.id), g=gens(v.id), ct=contacts(v);
  const vus=ct.slice(0,3), reste=ct.length-vus.length;
  const troisPremiers=l.slice(0,2), autres=l.length-troisPremiers.length;

  return '<div class="pad">'+
    '<p class="nomlieu">'+esc(v.name)+'</p>'+
    '<p class="villelieu">'+esc(v.type)+(v.city?' · '+esc(v.city):'')+(zoneOf(v)!=="?"?' · '+esc(nomZone(zoneOf(v))):'')+' · référent '+esc(v.owner)+'</p>'+
    regle(v)+
    '<p class="phrase">'+(e.em?'<em class="'+e.em+'">'+esc(e.phrase)+'</em>':esc(e.phrase))+'</p>'+
    '<p class="depuis">'+esc(e.sous)+'</p>'+

    '<div class="btns">'+
      '<button class="btn" data-f="'+(v.status==="valide"?"date":"ecrire")+'">'+(v.status==="valide"?"La date : "+(v.dateActee?fmtDate(v.dateActee):"à renseigner"):"Écrire à ce lieu")+'</button>'+
      '<div class="duo"><button class="btn ghost" data-f="consigner">Consigner</button>'+
      '<button class="btn ghost" data-f="rappel">'+(v.rappel?"Rappel : "+fmtDate(v.rappel):"Poser un rappel")+'</button></div>'+
      (v.status!=="valide"?'<button class="btn ghost" data-f="date">On a la date</button>':'')+
      '<button class="btn ghost" data-pin="'+v.id+'">'+(v.pin?"\u2605 Prioritaire — enlever":"\u2606 Marquer prioritaire")+'</button>'+
    '</div>'+

    (v.status==="valide"?jourHTML(v):'')+
    (champEnEdition==="notes"
      ? '<div class="note" style="padding:8px 10px"><input class="box" id="ce" style="width:100%" placeholder="ce qu\'il faut savoir" value="'+esc(v.notes||"")+'"><button class="go" data-ceok="notes" style="margin-top:7px">ok</button></div>'
      : '<button class="note" style="display:block;width:100%" data-ce="notes">'+(v.notes?esc(v.notes):'<span style="color:var(--dust)">+ ajouter une note</span>')+'</button>')+

    '<div class="h4"><span>Contact du lieu</span>'+(reste>0?'<button class="plus" data-f="contacts">+ '+reste+' autre'+(reste>1?'s':'')+'</button>':'')+'</div>'+
    vus.map(c=>champEnEdition===c.cle
      ? '<div class="ct edit"><span class="g">'+c.g+'</span>'+
        '<input class="box" id="ce" style="width:100%" placeholder="'+esc(c.t)+'" value="'+esc(c.val||"")+'">'+
        '<button class="go" data-ceok="'+c.cle+'">ok</button></div>'
      : '<button class="ct" data-ce="'+c.cle+'">'+
        '<span class="g">'+c.g+'</span>'+
        '<span class="v">'+(c.manque?'<span class="miss">à trouver</span>':esc(c.val))+'<small>'+esc(c.t)+'</small></span>'+
        '<span class="go">'+(c.manque?'ajouter':'modifier')+'</span></button>').join("")+

    '<div class="h4"><span>Notre entrée</span><button class="plus" data-pers="new">+ ajouter</button></div>'+
    (g.length? g.map(p=>'<button class="entree" data-pers="'+p.k+'" style="width:100%"><div class="qui">'+esc(p.nom)+'</div>'+
        '<div class="via">'+(p.role?esc(p.role)+' · ':'')+(p.via?'connu par '+esc(p.via):'personne du groupe ne le connaît')+
        (p.tel?' · '+esc(p.tel):'')+'</div>'+
        '</button>').join("")
      : '<div class="entree vide"><div class="qui">Personne pour l\'instant. Demander au groupe si quelqu\'un connaît.</div></div>')+

    '<div class="h4"><span>'+(l.length?l.length+' échange'+(l.length>1?'s':''):'Aucun échange')+'</span></div>'+
    troisPremiers.map(x=>'<div class="ev"><div class="d">'+dat(x.d)+'</div>'+
      '<div class="n">'+esc(x.n)+'<span>'+esc(x.q)+' · '+esc(x.c)+'</span></div></div>').join("")+
    (autres>0?'<button class="deplier" data-f="histo">Voir les '+autres+' échange'+(autres>1?'s':'')+' plus ancien'+(autres>1?'s':'')+' ↓</button>':'')+
  '</div>';
}
function dat(iso){
  const d=new Date(iso);
  return MOIS[d.getMonth()].slice(0,4)+'.<br>'+d.getDate()+' · '+String(d.getFullYear()).slice(2);
}

function zonesDispo(){
  const c={}; VENUES.forEach(v=>{const z=zoneOf(v); c[z]=(c[z]||0)+1;});
  return Object.keys(c)
    .sort((a,b)=>a==="?"?1:b==="?"?-1:c[b]-c[a])
    .map(z=>[z,nomZone(z)+" ("+c[z]+")"]);
}

  },

      grp("Secteur",'zones',zonesDispo())+
      grp("Référent",'owners',owners)+

function sugZone(saisie){
  const box=document.getElementById("m-zsug"); if(!box) return;

/* Ce qui s'est passé depuis sept jours, et ce qui tombe dans les sept qui viennent. */
function bilan(){
  const debut=new Date(AUJ); debut.setDate(debut.getDate()-7);
  const fin=new Date(AUJ);   fin.setDate(fin.getDate()+7);
  const faits=EX.filter(e=>new Date(e.d)>=debut&&new Date(e.d)<=AUJ)
                .sort((a,b)=>a.d.localeCompare(b.d));
  const parQui={}; faits.forEach(e=>{ (parQui[e.q]=parQui[e.q]||[]).push(e); });
  const urgent=VENUES.filter(v=>{
    const h=echeance(v);
    return h.b<=1 && h.ts<=fin.getTime();
  });
  const dates=VENUES.filter(v=>v.status==="valide"&&v.dateActee&&new Date(v.dateActee)>=AUJ);
  return {faits,parQui,urgent,dates,debut};
}

}

function ics(evts){
  const pad=n=>String(n).padStart(2,"0");
  const jour=d=>{const x=new Date(d);return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate());};
  const lend=d=>{const x=new Date(d);x.setDate(x.getDate()+1);return jour(x);};
  const ech=t=>String(t||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const now=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  let t="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MNG//FR\r\nCALSCALE:GREGORIAN\r\n";
  evts.forEach(e=>{
    t+="BEGIN:VEVENT\r\nUID:mng-"+e.uid+"@septemberagain\r\nDTSTAMP:"+now+"\r\n"+
       "DTSTART;VALUE=DATE:"+jour(e.d)+"\r\nDTEND;VALUE=DATE:"+lend(e.d)+"\r\n"+
       "SUMMARY:"+ech(e.titre)+"\r\n"+(e.desc?"DESCRIPTION:"+ech(e.desc)+"\r\n":"")+
       (e.lieu?"LOCATION:"+ech(e.lieu)+"\r\n":"")+
       "BEGIN:VALARM\r\nTRIGGER:-PT9H\r\nACTION:DISPLAY\r\nDESCRIPTION:"+ech(e.titre)+"\r\nEND:VALARM\r\n"+
       "END:VEVENT\r\n";
  });
  return t+"END:VCALENDAR\r\n";
}
function telecharger(txt,nom,type){
  try{
    const u=URL.createObjectURL(new Blob([txt],{type:type||"text/plain"}));
    const a=document.createElement("a"); a.href=u; a.download=nom; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(e){ fail("téléchargement",e); }
}

}

  telecharger(ics([{uid:"d-"+v.id,d:v.dateActee,titre:v.name+" — concert",

/* Export CSV, dans les mêmes colonnes que l'application en service,
   plus celles ajoutées ici : rappel, date du concert, déroulé du jour J. */
function csv(){
  // un retour à la ligne dans une cellule perturbe certains tableurs : on l'aplatit
  const q=x=>'"'+String(x==null?"":x).replace(/\r?\n/g," · ").replace(/"/g,'""')+'"';
  const jr=d=>d?fmtDate(d):"";
  const GROUPE={0:"Fenêtre ouverte",1:"Silence dépassé",2:"À venir",3:"Jamais contacté",4:"Date obtenue",5:"Laissé tomber"};
  const head=["Nom","Prioritaire","Rappel","Date du concert","Type","Ville","Secteur","Pays",
    "Mois édition","Situation","Échéance","Référent","Mail","Téléphone","Lien","Adresse",
    "Dernier contact","Mois de silence","Personnes","Notes",
    "Arrivée","Balances","Heure du show","Temps de show","Rémunération","Contacts du jour",
    "On y retourne","Bilan","Historique"];
  const lignes=VENUES.slice().sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(v=>{
    const lg=logs(v.id), l=lg[0], h=echeance(v), j=v.jour||{};
    return [v.name, v.pin?"oui":"", jr(v.rappel), jr(v.dateActee), v.type, v.city, nomZone(zoneOf(v)),
      v.pays==="CH"?"Suisse":"France", v.month?MOIS[v.month-1]:"", GROUPE[h.b]||"", h.lab,
      v.owner, v.mail, v.tel, v.link, v.adresse,
      l?fmtDate(l.d):"", l?moisDepuis(l.d):"",
      gens(v.id).map(p=>p.nom+(p.role?" ("+p.role+")":"")+(p.tel||p.mail?" "+(p.tel||p.mail):"")+(p.via?" [via "+p.via+"]":"")).join(" | "),
      v.notes,
      j.arrivee||"", j.balances||"", j.show||"", j.duree||"", j.cachet||"",
      (j.contacts||[]).map(c=>[c.role,c.nom,c.tel,c.mail].filter(Boolean).join(" ")).join(" | "),
      j.retour==="oui"?"oui":j.retour==="non"?"non":j.retour==="peut"?"peut-être":"", j.bilan||"",
      lg.map(e=>fmtDate(e.d)+" ("+e.q+", "+e.c+") : "+e.n).join(" | ")
    ].map(q).join(";");
  });
  return "\uFEFF"+head.map(q).join(";")+"\n"+lignes.join("\n");
}

  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(fin,fin);
  else fin();
}

    if(!nom){ alert("Il faut au moins un nom de lieu."); return; }
    const v={id:"n"+Date.now().toString(36),name:nom,city:g("N-ville"),zone:g("N-zone"),
      type:(ficheEnCours&&ficheEnCours.type)||"Salle",month:(ficheEnCours&&ficheEnCours.month)||null,
      owner:(ficheEnCours&&ficheEnCours.owner)||moi,status:"a_contacter",pays:"FR",
      mail:g("N-mail"),tel:g("N-tel"),link:g("N-site"),notes:g("N-note")};
    VENUES.push(v); sauveLieu(v); ficheEnCours=null; sel=v.id; fermerFeuille(); rendre(); return;
  }
  if(e.target.closest("[data-dateneuve]")){
    const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
    const nom=g("D-nom"), jour=g("D-jour");
    if(!nom||!jour){ alert("Il faut un nom de lieu et une date."); return; }
    const v={id:"n"+Date.now().toString(36),name:nom,city:g("D-ville"),
      type:(ficheEnCours&&ficheEnCours.type)||"Salle",month:null,owner:moi,
      status:"valide",dateActee:jour,pays:"FR"};
    VENUES.push(v); sauveLieu(v); ficheEnCours=null; sel=v.id; fermerFeuille(); rendre(); return;
  }

  const vd=e.target.closest("[data-vdel]");
  if(vd){
    const v=VENUES.find(x=>x.id===vd.dataset.vdel);
    if(v&&confirm("Supprimer « "+v.name+" » ? La fiche, ses échanges et ses contacts partent pour tout le monde.")){
      supprLieu(v.id);
      EX.splice(0,EX.length,...EX.filter(x=>x.v!==v.id));
      GENS.splice(0,GENS.length,...GENS.filter(x=>x.v!==v.id));
      VENUES.splice(VENUES.indexOf(v),1);
      sel=null; ficheEnCours=null; fermerFeuille(); rendre();
    }
    return;
  }
  const tr=e.target.closest("[data-tri]");
  if(tr){ tri=tr.dataset.tri; fermerFeuille(); rendre(); return; }
  const bo=e.target.closest("[data-bool]");
  if(bo){ F[bo.dataset.bool]=!F[bo.dataset.bool]; ouvrirFeuille("Filtrer",FEUILLES.filtres()); rendre(); return; }
  const off=e.target.closest("[data-off]");
  if(off){
    const k=off.dataset.off, v=off.dataset.val;
    if(k==="preset") F.preset=null;
    else if(k==="manque"||k==="sansMois") F[k]=false;
    else F[k]=F[k].filter(x=>x!==v);
    rendre(); return;
  }
  if(e.target.closest("[data-raz]")){ F={...F0,types:[],owners:[],etats:[],zones:[]}; fermerFeuille(); rendre(); return; }
  if(e.target.closest("[data-fermer]")){ fermerFeuille(); return; }

  /* --- personnes --- */
  const pe=e.target.closest("[data-pers]");
  if(pe){
    const k=pe.dataset.pers;
    personneEnCours = k==="new" ? {v:sel} : GENS.find(g=>g.k===k);
    ouvrirFeuille(k==="new"?"Ajouter quelqu'un":"Notre entrée",FEUILLES.personne(personneEnCours||{v:sel}));
    return;
  }
  const via=e.target.closest("[data-via]");
  if(via){
    if(personneEnCours) personneEnCours.via=via.dataset.via;
    via.parentNode.querySelectorAll("[data-via]").forEach(b=>b.setAttribute("aria-pressed",String(b===via)));
    return;
  }
  const ps=e.target.closest("[data-psave]");
  if(ps){
    const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
    const rec={nom:g("p-nom"),role:g("p-role"),tel:g("p-tel"),mail:g("p-mail"),note:g("p-note"),
               via:(personneEnCours&&personneEnCours.via)||"",v:sel};
    if(!rec.nom){ return; }
    let cible;
    if(ps.dataset.psave==="new"){ rec.k=idNeuf("p"); GENS.push(rec); cible=rec; }
    else { cible=GENS.find(x=>x.k===ps.dataset.psave); Object.assign(cible,rec); }
    sauvePersonne(cible);
    personneEnCours=null; fermerFeuille(); rendre(); return;
  }
  const pd=e.target.closest("[data-pdel]");
  if(pd){
    const i=GENS.findIndex(x=>x.k===pd.dataset.pdel);
    if(i>=0){ supprPersonne(GENS[i].k); GENS.splice(i,1); }
    personneEnCours=null; fermerFeuille(); rendre(); return;
  }

  /* --- autres feuilles --- */
  const f=e.target.closest("[data-f]");
  if(f){
    const k=f.dataset.f;
    if(k==="filtres"){ ouvrirFeuille("Filtrer",FEUILLES.filtres()); return; }
    if(k==="tri"){ ouvrirFeuille("Trier",FEUILLES.tri()); return; }
    if(k==="rappel"){ const vv=VENUES.find(x=>x.id===sel); if(vv) ouvrirFeuille("Poser un rappel",FEUILLES.rappel(vv)); return; }
    if(k==="date"){
      const vv=VENUES.find(x=>x.id===sel); if(!vv) return;
      ficheJour={...(vv.jour||{}),contacts:((vv.jour&&vv.jour.contacts)||[]).map(c=>({...c})),adresse:vv.adresse||""};
      rouvrirDate(); return;
    }
    if(k==="ecrire"){ const vv=VENUES.find(x=>x.id===sel); if(vv) ouvrirFeuille("Écrire à "+vv.name,FEUILLES.ecrire(vv)); return; }
    if(k==="qui"){ ouvrirFeuille("Qui es-tu ?",FEUILLES.qui()); return; }
    if(k==="bilan"){ ouvrirFeuille("Bilan de la semaine",FEUILLES.bilan()); return; }
    if(k==="reglages"){ ouvrirFeuille("Réglages",FEUILLES.reglages()); return; }
    if(k==="nouvdate"){ ouvrirFeuille("Ajouter une date",FEUILLES.nouvdate()); return; }
    const v=VENUES.find(x=>x.id===sel); if(!v) return;
    ouvrirFeuille(k==="histo"?"Tous les échanges":k==="contacts"?"Contacts":"Consigner un échange",FEUILLES[k](v));
    return;
  }
  if(e.target.closest("#modifier")){
    const v=VENUES.find(x=>x.id===sel);
    if(v){ ficheEnCours={...v}; ouvrirFeuille("Modifier la fiche",FEUILLES.modifier(v)); }
    return;
  }
  const ce=e.target.closest("[data-ce]");
  if(ce){ champEnEdition=ce.dataset.ce; rendre();
    const i=document.getElementById("ce"); if(i){ i.focus(); i.select(); } return; }
  const ok=e.target.closest("[data-ceok]");
  if(ok){
    const v=VENUES.find(x=>x.id===sel), i=document.getElementById("ce");
    if(v&&i){ v[ok.dataset.ceok]=i.value.trim(); sauveLieu(v); }
    champEnEdition=null; rendre(); return;
  }
  const zs=e.target.closest("[data-zset]");
  if(zs){
    if(ficheEnCours) ficheEnCours.zone=zs.dataset.zset;
    const zi=document.getElementById("m-zone");
    if(zi){ zi.value=zs.dataset.zset; zi.focus(); }
    sugZone(zs.dataset.zset);
    return;
  }
  const vs=e.target.closest("[data-vset]");
  if(vs){
    const k=vs.dataset.vset, val=vs.dataset.val;
    if(ficheEnCours) ficheEnCours[k] = k==="month" ? (val?Number(val):null) : val;
    vs.parentNode.querySelectorAll("[data-vset]").forEach(b=>b.setAttribute("aria-pressed",String(b===vs)));
    return;
  }
  const vsave=e.target.closest("[data-vsave]");
  if(vsave){
    const v=VENUES.find(x=>x.id===vsave.dataset.vsave);
    const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
    if(v&&ficheEnCours){
      Object.assign(v,ficheEnCours,{name:g("m-nom")||v.name,city:g("m-ville"),zone:g("m-zone"),notes:g("m-note")});
      sauveLieu(v);
    }
    ficheEnCours=null; fermerFeuille(); rendre(); return;
  }
  if(e.target.closest("#fermer")||e.target.closest("#voile")){ fermerFeuille(); return; }
  if(e.target.closest("#retour")){ sel=null; fermerFeuille(); rendre(); return; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(champEnEdition){champEnEdition=null;rendre();} else fermerFeuille(); }
  if(e.key==="Enter"&&e.target.id==="ce"){
    const v=VENUES.find(x=>x.id===sel);
    if(v){ v[champEnEdition]=e.target.value.trim(); sauveLieu(v); }
    champEnEdition=null; rendre();
  }
});



/* ============ persistance et démarrage ============ */

/* ===================================================================
   Persistance — tout ce qui relie l'écran à la base.
   Les collections portent le préfixe beta_ : la production n'est
   ni lue ni écrite par cette page.
   =================================================================== */

const PFX = "beta_";

/* Les adaptateurs. La base parle le format de l'application en service
   (email, phone, country, venueIds) ; l'écran parle le sien. On traduit
   aux deux frontières, jamais au milieu. */
function vIn(d){
  return {id:d.id,name:d.name||"",type:d.type||"Salle",city:d.city||"",pays:d.country||"FR",
    month:d.month||null,status:d.status||"a_contacter",owner:d.owner||"",
    mail:d.email||"",tel:d.phone||"",link:d.link||"",notes:d.notes||"",contact:d.contact||"",
    zone:d.zone||"",pin:!!d.pin,rappel:d.relanceFrom||null,snooze:d.snooze||null,
    dateActee:d.dateActee||null,jour:d.jour||null,adresse:d.adresse||""};
}
function vOut(v){
  return {id:v.id,name:v.name||"",type:v.type||"Salle",city:v.city||"",country:v.pays||"FR",
    month:v.month||null,status:v.status||"a_contacter",owner:v.owner||"",
    email:v.mail||"",phone:v.tel||"",link:v.link||"",notes:v.notes||"",contact:v.contact||"",
    zone:v.zone||"",pin:!!v.pin,relanceFrom:v.rappel||null,snooze:v.snooze||null,
    dateActee:v.dateActee||null,jour:v.jour||null,adresse:v.adresse||""};
}
function xIn(d){ return {id:d.id,v:d.venueId,d:d.date,q:d.who||"",c:d.channel||"mail",n:d.note||""}; }
function xOut(e){ return {id:e.id,venueId:e.v,date:e.d,who:e.q||"",channel:e.c||"mail",note:e.n||""}; }
function gIn(d){
  return {k:d.id,v:(d.venueIds&&d.venueIds[0])||"",nom:d.name||"",role:d.role||"",
          via:d.via||"",tel:d.phone||"",mail:d.email||"",note:d.notes||""};
}
function gOut(g){
  return {id:g.k,name:g.nom||"",role:g.role||"",via:g.via||"",
          phone:g.tel||"",email:g.mail||"",notes:g.note||"",venueIds:g.v?[g.v]:[]};
}

const idNeuf = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* --- écritures --- */
async function sauveLieu(v){ if(!db||!v) return; try{ await db.doc("venues/"+v.id).set(vOut(v)); }catch(e){ fail("enregistrement",e); } }
async function supprLieu(id){
  if(!db) return;
  try{
    for(const e of EX.filter(x=>x.v===id)) await db.doc("exchanges/"+e.id).delete();
    for(const g of GENS.filter(x=>x.v===id)) await db.doc("people/"+g.k).delete();
    await db.doc("venues/"+id).delete();
  }catch(e){ fail("suppression",e); }
}
async function sauveEx(e){ if(!db||!e) return; try{ await db.doc("exchanges/"+e.id).set(xOut(e)); }catch(err){ fail("enregistrement",err); } }
async function supprEx(id){ if(!db) return; try{ await db.doc("exchanges/"+id).delete(); }catch(e){} }
async function sauvePersonne(g){ if(!db||!g) return; try{ await db.doc("people/"+g.k).set(gOut(g)); }catch(e){ fail("enregistrement",e); } }
async function supprPersonne(k){ if(!db) return; try{ await db.doc("people/"+k).delete(); }catch(e){} }
async function sauveReglages(){ if(!db) return; try{ await db.doc("meta/reglages").set(JSON.parse(JSON.stringify(R))); }catch(e){ fail("enregistrement",e); } }

/* --- sauvegarde et restauration, au format de l'application en service --- */
function dump(){
  const liens={};
  R.liens.forEach(x=>{ liens[x.l]=x.u; });
  return {format:"september-again/1", exporte:new Date().toISOString(),
    venues:VENUES.map(vOut), people:GENS.map(gOut), exchanges:EX.map(xOut),
    links:liens, settings:{members:R.membres,boite:R.mail,groupe:R.groupe,types:R.types,modeles:R.modeles}};
}
async function doBackup(){
  const data=JSON.stringify(dump(),null,1), nom="mng-beta-"+AUJ.toISOString().slice(0,10)+".json";
  try{
    const u=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a=document.createElement("a"); a.href=u; a.download=nom; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(e){ fail("téléchargement",e); }
}

const LIENS_LABELS={epk:"EPK",ecoute:"Écoute",youtube:"YouTube",site:"Site",insta:"Instagram",
  facebook:"Facebook",rider:"Rider",fichetech:"Fiche technique"};

async function importer(obj,remplacer){
  if(!obj||typeof obj!=="object") throw new Error("fichier illisible");
  const V=obj.venues||[], P=obj.people||[], X=obj.exchanges||[];
  if(!V.length) throw new Error("aucun lieu dans le fichier");

  if(remplacer){
    for(const v of VENUES.slice()) { try{ await db.doc("venues/"+v.id).delete(); }catch(e){} }
    for(const g of GENS.slice())   { try{ await db.doc("people/"+g.k).delete(); }catch(e){} }
    for(const e of EX.slice())     { try{ await db.doc("exchanges/"+e.id).delete(); }catch(er){} }
    VENUES.length=0; GENS.length=0; EX.length=0;
  }

  const jobs=[];
  V.forEach(d=>{ const v=vIn(d); VENUES.push(v); jobs.push(()=>db.doc("venues/"+v.id).set(vOut(v))); });
  X.forEach(d=>{ const e=xIn(d); if(!e.id) e.id=idNeuf("x"); EX.push(e); jobs.push(()=>db.doc("exchanges/"+e.id).set(xOut(e))); });

  /* Une personne rattachée à plusieurs lieux devient une fiche par lieu :
     c'est le choix retenu — plus simple, et un doublon ne gêne personne. */
  P.forEach(d=>{
    const ids=(d.venueIds&&d.venueIds.length)?d.venueIds:[""];
    ids.forEach((vid,i)=>{
      const g=gIn({...d,venueIds:[vid],id:i?d.id+"_"+i:d.id});
      GENS.push(g); jobs.push(()=>db.doc("people/"+g.k).set(gOut(g)));
    });
  });

  if(obj.links&&Object.keys(obj.links).length){
    R.liens=Object.keys(obj.links).filter(k=>obj.links[k])
      .map(k=>({l:LIENS_LABELS[k]||k,u:obj.links[k]}));
  }
  const st=obj.settings||{};
  if(st.members&&st.members.length) R.membres=st.members;
  if(st.boite) R.mail=st.boite;
  if(st.groupe) R.groupe=st.groupe;
  if(st.types&&st.types.length) R.types=st.types;
  if(st.modeles&&st.modeles.length) R.modeles=st.modeles;
  jobs.push(()=>db.doc("meta/reglages").set(JSON.parse(JSON.stringify(R))));

  for(let i=0;i<jobs.length;i+=4) await Promise.all(jobs.slice(i,i+4).map(f=>f()));
  rendre();
  return V.length+" lieux, "+GENS.length+" personnes, "+X.length+" échanges chargés.";
}

function choisirFichier(){
  return new Promise(res=>{
    const i=document.createElement("input");
    i.type="file"; i.accept=".json,application/json";
    i.onchange=async()=>{
      if(!i.files||!i.files[0]) return res(null);
      try{ res(JSON.parse(await i.files[0].text())); }catch(e){ res(null); }
    };
    i.click();
  });
}

/* ===================================================================
   Démarrage
   =================================================================== */
async function boot(){
  note("Ouverture…");
  db = await openDb();
  if(dbMode==="gate"){ gate(""); return; }

  $("#boot").hidden=true; $("#shell").hidden=false;
  try{ moi = localStorage.getItem("mng_moi") || moi; }catch(e){}

  if(dbMode==="firebase"){
    const sortir=document.createElement("button");
    sortir.className="roue"; sortir.textContent="⏻"; sortir.title="Se déconnecter";
    sortir.onclick=()=>signOut();
    document.querySelector(".topd").appendChild(sortir);
  }

  try{
    const r=await db.doc("meta/reglages").get();
    if(r.exists&&r.data()) R={...R,...r.data()};
  }catch(e){}
  if(!R.modeles||!R.modeles.length) R.modeles=R_DEFAUT_MODELES;
  if(!R.membres.includes(moi)) moi=R.membres[0];
  rendre();

  let vivant=false;
  db.collection("venues").onSnapshot(s=>{
    if(!s.docs.length&&!vivant) { vivant=true; rendre(); return; }
    vivant=true;
    VENUES.length=0; s.docs.forEach(d=>VENUES.push(vIn({...d.data(),id:d.id})));
    rendre();
  },e=>fail("lecture des lieux",e));

  db.collection("exchanges").onSnapshot(s=>{
    EX.length=0; s.docs.forEach(d=>EX.push(xIn({...d.data(),id:d.id})));
    if(vivant) rendre();
  },e=>fail("lecture des échanges",e));

  db.collection("people").onSnapshot(s=>{
    GENS.length=0; s.docs.forEach(d=>GENS.push(gIn({...d.data(),id:d.id})));
    if(vivant) rendre();
  },e=>fail("lecture des personnes",e));
}

function start(){
  window.addEventListener("error",e=>fail("script",e.error||e));
  window.addEventListener("unhandledrejection",e=>fail("réseau ou base",e.reason));
  try{ boot().catch(e=>fail("démarrage",e)); }catch(e){ fail("démarrage",e); }
  setTimeout(()=>{
    const a=$("#app");
    if(!hardError && $("#shell") && !$("#shell").hidden && (!a||!a.innerHTML.trim()))
      note("Rien ne s'est affiché, et aucune erreur n'a été signalée. Regarde la console (F12).",true);
  },8000);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();

})();
</script>
